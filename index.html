‌ی دردش وصل می‌شی.", "t": [0.0191, 0.0766, 0.134, 0.2295, 0.3101, 0.3778, 0.4324, 0.474, 0.5417, 0.5703, 0.664, 0.7056, 0.7862, 0.8539, 0.9085, 0.9762]}]}, {"id": "k3-s13", "ch": 3, "title": "کار با آدم‌های مختلف", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s13-01", "text": "توی مکالمه‌های روزانه، با دو دسته‌ی اصلی از مخاطب‌ها روبه‌رو می‌شی:", "t": [0.0, 0.0618, 0.2119, 0.3178, 0.3649, 0.412, 0.5032, 0.5797, 0.6268, 0.7475, 0.8534, 0.9299]}, {"id": "k3-s13-02", "text": "آدم‌هایی که نگرش منفی دارن، و آدم‌هایی که به‌ظاهر همه‌چیز براشون خوبه.", "t": [0.0391, 0.1484, 0.1911, 0.2605, 0.3299, 0.3992, 0.4286, 0.538, 0.5807, 0.6767, 0.7728, 0.8688, 0.9382]}, {"id": "k3-s13-03", "text": "هر کدوم از این دو گروه، رویکرد متفاوتی لازم دارن، و فهمیدن این تفاوت، مهارتت رو یه سطح بالاتر می‌بره.", "t": [0.0219, 0.0485, 0.0918, 0.1185, 0.1535, 0.1801, 0.2234, 0.2834, 0.3517, 0.395, 0.4548, 0.4764, 0.5473, 0.5887, 0.6497, 0.7206, 0.7521, 0.7836, 0.825, 0.8958, 0.9569]}, {"id": "k3-s13-04", "text": "با آدم‌های مثبت چطوری کار کنی؟", "t": [0.0978, 0.1813, 0.3691, 0.5048, 0.6666, 0.7762, 0.8858]}, {"id": "k3-s13-05", "text": "اینا می‌گن: «همه‌چی خوبه.» اینجا باید کمکش کنی مشکل رو ببینه. از سؤال‌های کشف استفاده کن.", "t": [0.0225, 0.0697, 0.1365, 0.2016, 0.3311, 0.3872, 0.4343, 0.4814, 0.5194, 0.5665, 0.5955, 0.7045, 0.7345, 0.8116, 0.8511, 0.9282, 0.9583]}, {"id": "k3-s13-06", "text": "مثلا: بیشترین چیزی که از کارت دوست داری چیه؟ یه چیزی هست که اذیتت کنه؟", "t": [0.0294, 0.1753, 0.2588, 0.3118, 0.3443, 0.3769, 0.4299, 0.4828, 0.5358, 0.6432, 0.6809, 0.7423, 0.7918, 0.8296, 0.9027, 0.9523]}, {"id": "k3-s13-07", "text": "مسیر رفت‌وآمدت چطوره؟ زمان آزاد داری؟", "t": [0.0458, 0.168, 0.3842, 0.611, 0.7176, 0.8241, 0.9306]}, {"id": "k3-s13-08", "text": "درآمدت سقف داره یا قابل رشده؟ اگه قرار باشه یه چیز بهتر بشه، دوست داری کدوم باشه؟", "t": [0.0171, 0.1031, 0.1532, 0.2153, 0.2535, 0.3156, 0.4359, 0.4774, 0.5288, 0.5803, 0.6119, 0.6534, 0.7049, 0.7464, 0.7978, 0.8492, 0.9007, 0.9521]}, {"id": "k3-s13-09", "text": "برای هر مشکلی، تو باید راهکار داشته باشی. پول، جایزه‌ی حل مسئله‌ست.", "t": [0.0309, 0.092, 0.1296, 0.2024, 0.2399, 0.301, 0.3855, 0.4583, 0.5801, 0.6673, 0.7799, 0.8299, 0.9582]}, {"id": "k3-s13-10", "text": "و آدم‌های منفی؟ اینا طلاان، چون مشکل دارن.", "t": [0.0321, 0.0767, 0.2227, 0.4047, 0.5188, 0.6835, 0.7567, 0.8475, 0.9382]}, {"id": "k3-s13-11", "text": "بذار مشکلشون رو بگن. گوش بده و همدلی کن. بعد بگو: «می‌خوای مشکلت رو حل کنی؟»", "t": [0.0202, 0.0755, 0.1627, 0.1968, 0.2891, 0.3394, 0.3897, 0.4161, 0.4903, 0.5896, 0.6318, 0.7285, 0.7981, 0.8581, 0.889, 0.9199, 0.9605]}, {"id": "k3-s13-12", "text": "نود درصد مواقع می‌گن آره.", "t": [0.0481, 0.1896, 0.3648, 0.5737, 0.7489, 0.8904]}, {"id": "k3-s13-13", "text": "اینجاست که یخ‌شکن روی دردشون سوار می‌شه: «من یه راهی پیدا کردم که این مشکل کمتر اذیتت کنه... اگه دوست داری بدونی چطور...»", "t": [0.0156, 0.0805, 0.1059, 0.155, 0.1882, 0.2452, 0.2864, 0.3768, 0.4019, 0.427, 0.4677, 0.5085, 0.5492, 0.5743, 0.6072, 0.6479, 0.6887, 0.7373, 0.8092, 0.8374, 0.8723, 0.9072, 0.9488, 0.9837]}]}, {"id": "k3-s14", "ch": 3, "title": "اگه پرسیدن «شغلت چیه؟»", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s14-01", "text": "یکی از بهترین فرصت‌ها برای یخ‌شکن، همین سؤال ساده‌ست.", "t": [0.0, 0.0748, 0.1318, 0.26, 0.3883, 0.4809, 0.6813, 0.7629, 0.8445, 0.9574]}, {"id": "k3-s14-02", "text": "بیشتر نتورکرها توی جواب دادن به این سؤال اشتباه می‌کنن.", "t": [0.0457, 0.1448, 0.292, 0.3592, 0.4423, 0.5255, 0.5767, 0.6438, 0.727, 0.8422, 0.9413]}, {"id": "k3-s14-03", "text": "اسم شرکت، عنوان سازمانی، یا حتی کلمه‌ی «نتورکر»، هیچ‌کدوم یخ‌شکن مناسبی نیستن.", "t": [0.0339, 0.0886, 0.1689, 0.2655, 0.4102, 0.4489, 0.4998, 0.5749, 0.7036, 0.7819, 0.8412, 0.91, 0.9692]}, {"id": "k3-s14-04", "text": "به‌جاش باید از منفعت حرف بزنی؛ از کاری که برای بقیه انجام می‌دی، نه از اینکه چی هستی.", "t": [0.0339, 0.1007, 0.1567, 0.1911, 0.2579, 0.3031, 0.4183, 0.4484, 0.4973, 0.5273, 0.5762, 0.6251, 0.6833, 0.7751, 0.8034, 0.8317, 0.8865, 0.9148, 0.9607]}, {"id": "k3-s14-05", "text": "چند تا نمونه جواب: من به آدم‌ها کمک می‌کنم کنار کارشون درآمد دوم بسازن.", "t": [0.0467, 0.0892, 0.1216, 0.1842, 0.3064, 0.3469, 0.3874, 0.4659, 0.519, 0.5975, 0.6633, 0.7544, 0.8328, 0.886, 0.9644]}, {"id": "k3-s14-06", "text": "من به آدم‌ها کمک می‌کنم زمانشون دست خودشون باشه.", "t": [0.0566, 0.1161, 0.1756, 0.2909, 0.369, 0.4843, 0.6368, 0.7149, 0.8488, 0.9455]}, {"id": "k3-s14-07", "text": "من کمک می‌کنم مادرها کنار بچه‌هاشون درآمد داشته باشن.", "t": [0.05, 0.1045, 0.176, 0.2816, 0.4041, 0.4927, 0.6493, 0.7548, 0.8604, 0.9489]}, {"id": "k3-s14-08", "text": "من کمک می‌کنم آدم‌ها زودتر به بازنشستگی برسن.", "t": [0.0579, 0.1216, 0.2051, 0.3284, 0.4518, 0.5751, 0.6387, 0.8416, 0.945]}, {"id": "k3-s14-09", "text": "من کمک می‌کنم مستقل خرج سفرشون رو بدن.", "t": [0.0607, 0.1335, 0.229, 0.37, 0.5109, 0.6064, 0.7701, 0.8429, 0.9384]}, {"id": "k3-s14-10", "text": "من کمک می‌کنم یه درآمد قابل رشد بسازن که سقف نداشته باشه.", "t": [0.044, 0.0941, 0.1597, 0.2567, 0.3067, 0.4036, 0.4849, 0.5506, 0.6475, 0.6975, 0.7632, 0.8758, 0.9571]}, {"id": "k3-s14-11", "text": "بعد از این جمله، ساکت. بذار بگه: «چطوری؟» اون موقع اجازه داری توضیح بدی.", "t": [0.0316, 0.0947, 0.1427, 0.2058, 0.2985, 0.3765, 0.436, 0.5209, 0.6816, 0.7214, 0.7706, 0.8294, 0.8786, 0.9373, 0.9771]}]}, {"id": "k3-s15", "ch": 3, "title": "مدل پیشرفته: «خودت خوب می‌دونی که...»", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s15-01", "text": "این فرمول، پیشرفته‌ترین شکل یخ‌شکنه.", "t": [0.0, 0.0984, 0.2935, 0.6057, 0.7131, 0.8974]}, {"id": "k3-s15-02", "text": "اینجا به‌جای اینکه سؤال بپرسی یا خبر بدی، مستقیم مشکل مخاطب رو اسم می‌بری؛ طوری که حس کنه درکش می‌کنی.", "t": [0.0281, 0.0819, 0.1358, 0.1896, 0.2347, 0.2886, 0.3163, 0.3528, 0.4037, 0.4719, 0.5211, 0.5798, 0.6101, 0.6499, 0.7531, 0.7922, 0.8162, 0.8402, 0.8718, 0.9108, 0.9574]}, {"id": "k3-s15-03", "text": "این تأیید مشکل، قبل از دادن راه‌حل، سطح اعتماد رو خیلی سریع بالا می‌بره.", "t": [0.04, 0.0971, 0.1814, 0.2727, 0.3298, 0.3733, 0.444, 0.5429, 0.5899, 0.6705, 0.7063, 0.7645, 0.8227, 0.8808, 0.9502]}, {"id": "k3-s15-04", "text": "ساختار فرمول پیشرفته اینه: «خودت خوب می‌دونی که...» به‌علاوه‌ی مشکل، به‌علاوه‌ی «کار من اینه که»، به‌علاوه‌ی راه‌حل.", "t": [0.0193, 0.0694, 0.1125, 0.1695, 0.2511, 0.2873, 0.3165, 0.3666, 0.4296, 0.5128, 0.5824, 0.6677, 0.7067, 0.7364, 0.7846, 0.8435, 0.9183, 0.9686]}, {"id": "k3-s15-05", "text": "چند تا مثال کاربردی: خودت خوب می‌دونی یه درآمد کفاف همه‌ی مخارج رو نمی‌ده... کار جدیدم کمکم می‌کنه درآمد دوم داشته باشم.", "t": [0.021, 0.0464, 0.0657, 0.0971, 0.2042, 0.2426, 0.2737, 0.327, 0.3507, 0.3966, 0.435, 0.4735, 0.5194, 0.5431, 0.635, 0.6671, 0.7145, 0.7543, 0.8017, 0.8491, 0.8812, 0.9287, 0.9684]}, {"id": "k3-s15-06", "text": "خودت می‌دونی با وجود بچه و خونه، نمی‌شه بیرون کار کرد... کار جدیدم کمکم می‌کنه کنار بچه‌ها درآمد داشته باشم.", "t": [0.0255, 0.0718, 0.1358, 0.1643, 0.2105, 0.2479, 0.2675, 0.3137, 0.3689, 0.424, 0.4614, 0.5387, 0.5737, 0.6254, 0.6688, 0.7205, 0.7639, 0.8156, 0.8673, 0.919, 0.9624]}, {"id": "k3-s15-07", "text": "خودت می‌دونی رژیم ضعف میاره... راهکاری دارم که بدون ضعف وزن کم کنیم.", "t": [0.0353, 0.1027, 0.196, 0.2634, 0.3179, 0.4645, 0.5665, 0.6312, 0.6711, 0.7358, 0.7881, 0.8403, 0.8802, 0.9449]}, {"id": "k3-s15-08", "text": "خودت می‌دونی بودجه‌ی سفر کمه... کاری که شروع کردم کمکم می‌کنه سالی دو تا سفر برم.", "t": [0.0316, 0.0909, 0.1729, 0.255, 0.3029, 0.4113, 0.4671, 0.5014, 0.5572, 0.613, 0.6688, 0.7353, 0.7911, 0.8254, 0.8597, 0.9048, 0.9498]}, {"id": "k3-s15-09", "text": "خودت می‌دونی پوست وقتی می‌افته، حس آدم عوض می‌شه... راهکاری دارم که پوست جمع‌تر و شاداب‌تر بشه.", "t": [0.0272, 0.083, 0.1603, 0.216, 0.2718, 0.3491, 0.3834, 0.4285, 0.4736, 0.5775, 0.6512, 0.698, 0.7268, 0.7736, 0.8294, 0.8492, 0.9229, 0.9607]}, {"id": "k3-s15-10", "text": "توی این فرمول، اول مشکل رو تأیید می‌کنی، بعد راه‌حل رو پیشنهاد می‌دی.", "t": [0.0343, 0.0868, 0.1393, 0.2411, 0.2953, 0.3626, 0.4039, 0.4841, 0.6168, 0.6691, 0.7462, 0.786, 0.888, 0.9527]}, {"id": "k3-s15-11", "text": "همین ترتیب، یعنی تأیید قبل از پیشنهاد، فرق یه مکالمه‌ی طبیعی رو با یه فروش تحمیلی می‌سازه.", "t": [0.0202, 0.076, 0.1426, 0.1985, 0.2651, 0.3102, 0.3445, 0.4326, 0.4777, 0.5121, 0.6002, 0.6668, 0.7011, 0.7355, 0.7699, 0.8257, 0.9031, 0.9804]}]}, {"id": "k3-s16", "ch": 3, "title": "یخ‌شکن‌های اشتباه و ممنوع", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s16-01", "text": "همون‌قدر که دونستن فرمول‌های درست مهمه، شناختن جمله‌های ممنوع هم ضروریه.", "t": [0.0, 0.1012, 0.1407, 0.2296, 0.3432, 0.4074, 0.5404, 0.6317, 0.7357, 0.8144, 0.855, 0.9463]}, {"id": "k3-s16-02", "text": "این جمله‌ها به‌محض اینکه شنیده بشن، هشدار فروشنده رو توی ذهن مخاطب روشن می‌کنن و همه‌ی تلاشت رو بی‌اثر می‌کنن.", "t": [0.0339, 0.068, 0.1265, 0.1769, 0.2273, 0.2777, 0.3232, 0.3775, 0.4493, 0.4773, 0.5141, 0.5509, 0.6052, 0.6508, 0.7051, 0.7244, 0.7699, 0.8242, 0.8523, 0.9066, 0.9609]}, {"id": "k3-s16-03", "text": "از این جمله‌ها دوری کن: می‌تونم چند دقیقه وقتت رو بگیرم؟ یه فرصت بی‌نظیر برات دارم.", "t": [0.0456, 0.0749, 0.1133, 0.1791, 0.2266, 0.3391, 0.4029, 0.4401, 0.4951, 0.5412, 0.5695, 0.6806, 0.7145, 0.7694, 0.8455, 0.9005, 0.9554]}, {"id": "k3-s16-04", "text": "شرکت ما بهترینه. محصولمون فوق‌العاده‌ست.", "t": [0.0602, 0.17, 0.2376, 0.49, 0.6806, 0.9333]}, {"id": "k3-s16-05", "text": "بیا یه توضیح بدم قانع شی. فقط گوش بده، بعد تصمیم بگیر.", "t": [0.0485, 0.1052, 0.1484, 0.232, 0.2887, 0.3588, 0.4863, 0.5799, 0.6735, 0.7871, 0.8294, 0.8918, 0.9441]}, {"id": "k3-s16-06", "text": "چرا این جمله‌ها کار نمی‌کنن؟ چون هشدار فروشنده رو روشن می‌کنن.", "t": [0.0437, 0.0971, 0.1505, 0.242, 0.2954, 0.4792, 0.5371, 0.6226, 0.7356, 0.7797, 0.8514, 0.9369]}, {"id": "k3-s16-07", "text": "ما قرار نیست بفروشیم، و قرار نیست فشار بیاریم.", "t": [0.0734, 0.128, 0.2169, 0.3057, 0.5329, 0.5677, 0.65, 0.7323, 0.8146, 0.9285]}, {"id": "k3-s16-08", "text": "قراره جذاب باشیم؛ قراره کاری کنیم که خودش بخواد ادامه بده.", "t": [0.046, 0.1173, 0.1772, 0.2678, 0.3688, 0.4535, 0.5382, 0.5903, 0.675, 0.776, 0.877, 0.9455]}, {"id": "k3-s16-09", "text": "هر بار که وسوسه شدی یکی از این جمله‌ها رو بگی، یادت بیار: وظیفه‌ی ما جذاب گفتنه، نه فروختن.", "t": [0.0282, 0.0614, 0.1051, 0.1384, 0.2029, 0.2466, 0.2902, 0.3235, 0.3672, 0.4421, 0.4754, 0.5714, 0.6145, 0.6576, 0.7172, 0.7437, 0.7868, 0.8778, 0.9094, 0.9805]}]}, {"id": "k3-s17", "ch": 3, "title": "جمع‌بندی و نقشه‌ی راه یخ‌شکن", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s17-01", "text": "مهارت یخ‌شکن یه سیستم منسجمه، نه یه مشت جمله‌ی پراکنده.", "t": [0.0, 0.1068, 0.2136, 0.2688, 0.3756, 0.5705, 0.6171, 0.6636, 0.7246, 0.8148, 0.934]}, {"id": "k3-s17-02", "text": "برای اینکه بهش مسلط بشی، باید همه‌ی اجزاش رو کنار هم به کار بگیری.", "t": [0.0597, 0.1345, 0.2238, 0.2842, 0.3591, 0.4453, 0.5076, 0.5699, 0.6442, 0.6825, 0.7448, 0.7831, 0.8215, 0.8718, 0.9461]}, {"id": "k3-s17-03", "text": "این نقشه‌ی راه، مسیر کامل رو از شروع مکالمه تا اجازه گرفتن برای توضیح نشونت می‌ده.", "t": [0.0402, 0.0839, 0.1484, 0.2075, 0.2656, 0.3236, 0.3594, 0.3951, 0.4532, 0.5336, 0.5694, 0.6386, 0.7079, 0.766, 0.8352, 0.9045, 0.9626]}, {"id": "k3-s17-04", "text": "یک، کشف درد: با سؤال‌های «آیا»، مشکل رو پیدا کن.", "t": [0.0524, 0.1139, 0.2289, 0.3617, 0.4069, 0.5228, 0.6085, 0.7174, 0.7844, 0.8934, 0.9604]}, {"id": "k3-s17-05", "text": "دو، انتخاب فرمول: «راهی پیدا کردم»، سؤال انگیزشی، یا «خودت می‌دونی» رو انتخاب کن.", "t": [0.0285, 0.1207, 0.2038, 0.3229, 0.3765, 0.4301, 0.5195, 0.5746, 0.6614, 0.6953, 0.7503, 0.8266, 0.8604, 0.9367, 0.9705]}, {"id": "k3-s17-06", "text": "سه، گفتن یخ‌شکن: یخ‌شکن رو بگو، و بعد سکوت کن.", "t": [0.042, 0.173, 0.2794, 0.4765, 0.5814, 0.6356, 0.7066, 0.7439, 0.815, 0.903, 0.9571]}, {"id": "k3-s17-07", "text": "چهار، گرفتن سؤال: صبر کن تا مخاطب سؤال کنه، و بعد توضیح بده.", "t": [0.0369, 0.1539, 0.2486, 0.3805, 0.4533, 0.5087, 0.5641, 0.6715, 0.7616, 0.8534, 0.8678, 0.8952, 0.9356, 0.963]}, {"id": "k3-s17-08", "text": "و چهار تا اصل نهایی.", "t": [0.0952, 0.1785, 0.3756, 0.4969, 0.656, 0.891]}, {"id": "k3-s17-09", "text": "اصل اول: یخ‌شکن هنر شروع کردنه، نه هنر توضیح دادن.", "t": [0.0425, 0.1129, 0.2515, 0.3647, 0.4413, 0.5363, 0.6812, 0.7274, 0.7881, 0.8776, 0.9527]}, {"id": "k3-s17-10", "text": "اصل دوم: آدم‌ها با ناخودآگاه تصمیم می‌گیرن؛ با همون حرف بزن.", "t": [0.0442, 0.1206, 0.2587, 0.3404, 0.3825, 0.5168, 0.5985, 0.7332, 0.7743, 0.8411, 0.895, 0.949]}, {"id": "k3-s17-11", "text": "اصل سوم: اختیار همیشه دست مخاطب بمونه؛ فشار نیار.", "t": [0.0512, 0.1446, 0.3046, 0.4129, 0.5062, 0.5694, 0.6627, 0.796, 0.8765, 0.957]}, {"id": "k3-s17-12", "text": "اصل چهارم: سکوت بعد از یخ‌شکن، قوی‌ترین ابزار توئه.", "t": [0.0452, 0.1196, 0.2826, 0.3832, 0.4644, 0.5263, 0.6742, 0.798, 0.8917, 0.9702]}]}, {"id": "end", "ch": 3, "title": "پایان جلسه", "eyebrow": "پایان کارگاه", "lines": [{"id": "end-01", "text": "پس حالا دیگه می‌دونی قرار نیست با توضیح زیاد، کسی رو مجبور به تصمیم کنی.", "t": [0.0, 0.0415, 0.1089, 0.1763, 0.2696, 0.337, 0.4044, 0.4459, 0.5263, 0.5937, 0.6481, 0.6896, 0.77, 0.8115, 0.8918, 0.9463]}, {"id": "end-02", "text": "اول باید اعتماد بسازی، فیلترها رو روشن نکنی، درد رو کشف کنی، و جمله‌ای بگی که خودش بخواد ادامه بده.", "t": [0.0215, 0.0583, 0.1037, 0.1667, 0.2545, 0.3246, 0.352, 0.3964, 0.4571, 0.4963, 0.5261, 0.5653, 0.6045, 0.625, 0.6922, 0.7313, 0.7612, 0.8097, 0.8675, 0.9253, 0.9645]}, {"id": "end-03", "text": "کل این مسیر توی دو تا مهارت جمع می‌شه:", "t": [0.0649, 0.1354, 0.2279, 0.3424, 0.4349, 0.5054, 0.5759, 0.7124, 0.8049, 0.9194]}, {"id": "end-04", "text": "ایجاد حسن تفاهم، برای ساختن اعتماد آنی؛ و یخ‌شکن، برای فعال کردن کنجکاوی.", "t": [0.0218, 0.0995, 0.1521, 0.2461, 0.3085, 0.3828, 0.4692, 0.5398, 0.5773, 0.6964, 0.7556, 0.8148, 0.8739, 0.9672]}, {"id": "end-05", "text": "خبر بده، منفعت بگو، اختیار بده؛ بعد سکوت کن، و بذار مخاطب سؤال کنه.", "t": [0.0242, 0.0793, 0.1489, 0.2481, 0.3317, 0.4119, 0.5113, 0.575, 0.6538, 0.7391, 0.7621, 0.8163, 0.8811, 0.9354, 0.9792]}]}], "chapters": [{"title": "قلب تصمیم‌گیری", " /* ---------- interactions at the end of a scene ---------- */
function sheet(html, onMount) {
  return new Promise(resolve => {
    const s = document.createElement('div'); s.className = 'sheet'; s.innerHTML = `<div class="box">${html}</div>`;
    document.body.appendChild(s);
    const close = v => { s.remove(); resolve(v); };
    onMount(s, close);
  });
}
/* every sheet goes on by itself: 5..1 next to the buttons; a tap restarts the count. Typing sheets (idleMs) hold the
   count while the viewer types and start it again once they have been idle that long; at 0 what was typed is saved. */
function sheetCd(s, done, idleMs = 0) {
  const acts = s.querySelector('.acts'); acts.insertAdjacentHTML('beforeend', '<span class="scd"><b></b><i></i></span>');
  const b = acts.querySelector('.scd b'), bar = acts.querySelector('.scd i'); let left = 5, last = 0;
  const paint = () => { b.textContent = fa(left); bar.style.transform = `scaleX(${(5 - left) / 5})`; };
  paint();
  if (idleMs) ['input', 'keydown', 'focusin', 'pointerdown'].forEach(e => s.addEventListener(e, () => { last = Date.now(); left = 5; paint(); }, true));
  const t = setInterval(() => {
    if (!s.isConnected) { clearInterval(t); return; }
    if (paused) return;
    if (idleMs && Date.now() - last < idleMs) return;  // still typing: hold
    left--; if (left <= 0) { clearInterval(t); done(); return; }
    paint(); sfx('tick', .06);
  }, 1000);
  return { reset() { left = 5; paint(); } };
}

        s.querySelectorAll('.chip')[a.ok].classList.add('ok'); if (!ok) c.classList.add('bad');
        sfx(ok ? 'ding' : 'tick', ok ? .3 : .2);
        s.querySelector('[data-why]').innerHTML = `<div class="why"><b>${ok ? 'دقیقاً همین.' : 'نه این‌یکی.'}</b> ${esc(a.why)}</div>`;
        S.ans.quiz = S.ans.quiz || {}; S.ans.quiz[gid] = ok; save(); cd.reset();
      });
      s.querySelector('[data-ok]').onclick = () => close();
      s.querySelector('[data-skip]').onclick = () => close();
    });
  } else if (a.k === 'build') {
    /* fill the slots of a formula; the finished sentence is shown live as a chat bubble */
    const prevB = prev || {};
    await sheet(`<h3>${esc(a.q)}</h3><p class="hint">${esc(a.hint || 'جاهای خالی را با زبان خودت پر کن.')}</p>
      ${a.parts.map(p => p.f ? `<label class="f">${esc(p.lb)}</label><input type="text" data-f="${p.f}" value="${esc(prevB[p.f] || '')}" placeholder="${esc(p.ph || '')}">` : '').join('')}
      <div class="preview" data-pv></div><div class="acts"><button class="btn" type="button" data-ok>ثبت جمله‌ی من</button>${skip}</div>`, (s, close) => {
      const ins = [...s.querySelectorAll('[data-f]')], pv = s.querySelector('[data-pv]');
      const sentence = (html) => a.parts.map(p => { if (!p.f) return html ? esc(p.t) : p.t; const v = (ins.find(x => x.dataset.f === p.f) || {}).value || '';
        return html ? `<i>${esc(v.trim() || '…' + p.lb + '…')}</i>` : v.trim(); }).join(' ');
      const paint = () => { pv.innerHTML = sentence(true); };
      ins.forEach(x => x.oninput = paint); paint(); setTimeout(() => ins[0] && ins[0].focus(), 300);
      s.querySelector('[data-ok]').onclick = () => { if (ins.some(x => x.value.trim())) { const v = {text: sentence(false)}; ins.forEach(x => v[x.dataset.f] = x.value.trim()); S.ans[key] = v; save(); sfx('ding', .3); } close(); };
      s.querySelector('[data-skip]').onclick = () => close();
      sheetCd(s, () => s.querySelector('[data-ok]').click(), 4000);
    });
  }
}

/* ---------- player ---------- */
const nextB = $('#next'), segs = $('#segs');
let waitNext = null;
function chapterGroups(ch) { return G.filter(g => g.ch === ch); }
function paintSegs(gi, frac) {
  const g = G[gi], list = chapterGroups(g.ch);
  if (segs.dataset.ch !== String(g.ch)) { segs.dataset.ch = g.ch; segs.innerHTML = list.map(() => '<i></i>').join(''); }
  [...segs.children].forEach((s, i) => { const k = GI[list[i].id]; s.style.setProperty('--p', k < gi ? 1 : k === gi ? frac : 0); });
}
function setScene(g) {
  const sc = $('#scene'); if (sc.dataset.g === g.id) return; sc.dataset.g = g.id;
  $('#eyebrow').textContent = g.eyebrow; $('#stitle').innerHTML = maskWords(g.title, .15, .06);
  sc.classList.remove('anim'); void sc.offsetWidth; sc.classList.add('anim');
  const lk = document.createElement('i'); lk.className = 'leak'; board.appendChild(lk); setTimeout(() => lk.remove(), 1800);
  bedFor(g.ch);
}
/* every chapter has its own bed (same warm lofi family); at a chapter turn the old one fades out and the new one fades in */
let bedCh = 0, bedT = null;
function bedFor(ch) {
  if (!DATA.music || !music.src || ch === bedCh) return;
  const first = !bedCh; bedCh = ch; clearTimeout(bedT);
  const swap = () => { music.src = `media/music/bed${ch}.mp3`; music.play().catch(() => {}); setMusic(musicT || BED); };
  if (first) { swap(); return; }
  const keep = musicT; setMusic(0); musicT = keep;
  bedT = setTimeout(swap, 900);
}
async function runGroup(gi) {
  const my = ++seq, g = G[gi]; S.pos = gi; save();
  setScene(g); nextB.classList.remove('wait'); beatSig = null;
  if (beatEl) { const old = beatEl; old.classList.add('out'); setTimeout(() => old.remove(), 380); beatEl = null; }
  const beats = V[g.id] || [];
  for (let i = 0; i < g.lines.length; i++) {
    if (my !== seq) return;
    cueLine(g.lines[i]);
    showBeat(beats[i] || null);
    paintSegs(gi, i / g.lines.length);
    preload(g, i);
    await playLine(g.lines[i]);
    while (paused && my === seq) await new Promise(r => setTimeout(r, 150));
    if (my !== seq) return;
    // no gap between lines: the next clip is already loaded in the spare player
  }
  paintSegs(gi, 1);
  if (my !== seq) return;
  S.done[g.id] = 1; save();
  await ask(g.id);
  if (my !== seq) return;
  if (gi === G.length - 1) { finale(); return; }
  // one flow (Amir): a scene without a question goes straight on — no 5..1 wait between scenes; only the question
  // sheets count 5..1 (sheetCd) before going on by themselves
  if (my === seq) runGroup(gi + 1);
}
/* 5-4-3-2-1 on the Next button, then it goes on by itself. Runs only after ask() resolved, so a typing or choosing
   sheet never auto-advances; it holds while paused. */
let cdT = null;
function stopCd() { clearInterval(cdT); cdT = null; nextB.classList.remove('cd'); nextB.style.setProperty('--cd', 0); }
function startCd(done) {
  stopCd(); let left = 5;
  if (!nextB.querySelector('.cdn')) nextB.insertAdjacentHTML('afterbegin', '<b class="cdn"></b>');
  const paint = () => { const n = nextB.querySelector('.cdn'); n.textContent = fa(left); n.style.animation = 'none'; void n.offsetWidth; n.style.animation = '';
    nextB.style.setProperty('--cd', (5 - left + 1) / 5); };
  nextB.style.setProperty('--cd', 0); nextB.classList.add('cd'); requestAnimationFrame(paint);
  cdT = setInterval(() => {
    if (paused || document.querySelector('.sheet, .map, .final')) return;
    left--; if (left <= 0) { stopCd(); done(); return; }
    paint(); sfx('tick', .08);
  }, 1000);
}
/* load the next line's clip into the spare player (the one playLine will use next), after this line's cross-fade,
   already seeked to its first word — so the next line starts instantly, with no buffering gap */
function preload(g, i) {
  const n = g.lines[i + 1] || (G[GI[g.id] + 1] || {lines: []}).lines[0]; if (!n) return;
  if (!HV.has(n.id)) { if (HA.has(n.id)) { const a = new Audio(); a.preload = 'auto'; a.src = `media/a/${n.id}.mp3`; } return; }
  const my = seq;
  setTimeout(() => {
    if (my !== seq) return;
    const spare = TV[tvi ^ 1]; if (spare === curEl || spare.dataset.id === n.id) return;
    spare.classList.remove('cur'); spare.dataset.id = n.id; spare.preload = 'auto'; spare.src = `media/v/${n.id}.mp4`; spare.load();
    const lead = (n.t || [0])[0];
    spare.addEventListener('loadedmetadata', () => { if (spare.dataset.id === n.id && lead > 0) spare.currentTime = Math.max(0, lead * spare.duration - .05); }, {once: true});
  }, 700);
}
function go(gi) { stopCd(); seq++; halt(); paused = false; setPP(); waitNext = null; capEl.innerHTML = ''; runGroup(Math.max(0, Math.min(G.length - 1, gi))); }
nextB.onclick = () => { sfx('tap', .25); stopCd(); if (waitNext) { const r = waitNext; waitNext = null; r(); } else go(S.pos + 1); };
$('#prev').onclick = () => { sfx('tap', .25); go(S.pos - 1); };
$('#again').onclick = () => { sfx('tap', .25); go(S.pos); };
function setPP() { $('#pp').innerHTML = svg(paused ? 'play' : 'pause'); }
$('#pp').onclick = () => { paused = !paused; setPP(); if (curEl) paused ? curEl.pause() : curEl.play().catch(() => {}); };
const SPEEDS = [1.1, 1.25, 1.4, 1];
$('#speed').onclick = () => { rate = SPEEDS[(SPEEDS.indexOf(rate) + 1) % SPEEDS.length]; $('#speed').textContent = fa(rate).replace('.', '٫') + '×'; if (curEl) curEl.playbackRate = rate; };
function setMute() { $('#mute').innerHTML = svg(muted ? 'muted' : 'sound'); }
$('#mute').onclick = () => { muted = !muted; setMute(); music.muted = muted; setMusic(musicT); TV.forEach(v => v.muted = muted); if (curEl) curEl.muted = muted; };
$('#prev').innerHTML = svg('back'); $('#again').innerHTML = svg('redo'); $('#mapb').innerHTML = svg('grid'); nextB.insertAdjacentHTML('beforeend', svg('fwd')); setPP(); setMute();
document.addEventListener('keydown', e => { if (e.target.closest('input,textarea,select')) return; if (e.key === ' ') { e.preventDefault(); $('#pp').click(); } if (e.key === 'ArrowLeft') nextB.click(); if (e.key === 'ArrowRight') $('#prev').click(); });

/* ---------- journey map ---------- */
$('#mapb').onclick = () => {
  const m = document.createElement('div'); m.className = 'map';
  const secs = DATA.chapters.map((c, i) => ({n: i + 1, title: c.title, sub: c.sub}));
  m.innerHTML = `<button class="ib" type="button" style="position:fixed;top:14px;left:14px" data-x>${svg('x')}</button><h2>نقشه‌ی سفر</h2>` + secs.map(c => {
    const gs = G.filter(g => g.ch === c.n), d = gs.filter(g => S.done[g.id]).length;
    return `<div class="chap glass"><div class="hh"><div class="ico">${svg(['flag', 'zap', 'handshake', 'ice'][c.n])}</div><div><div class="k">فصل ${fa(c.n)}</div><div class="tt">${esc(c.title)}</div><div class="hint" style="margin:0">${esc(c.sub || '')}</div></div></div>
      <div class="bar"><i style="width:${Math.round(d / gs.length * 100)}%"></i></div><div class="sc">${gs.map(g => `<button type="button" class="${S.done[g.id] ? 'done' : ''}" data-g="${GI[g.id]}">${esc(g.title)}</button>`).join('')}</div></div>`;
  }).join('');
  document.body.appendChild(m);
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { m.remove(); go(+b.dataset.g); });
};

/* ---------- finale: «my conversation card» (everything the learner wrote on the way) ---------- */
function finale() {
  const A = S.ans, f = document.createElement('div'); f.className = 'final';
  const item = (k, v) => v ? `<div class="item glass"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>` : '';
  const q = A.quiz || {}, qn = Object.keys(q).length, qok = Object.values(q).filter(Boolean).length;
  const lines = [['فکت من', A.fact], ['فکت دوم', A.fact2], ['ذهن‌خوانی من', A.mind], ['یخ‌شکن «راهی پیدا کردم»', (A.ice1 || {}).text], ['سؤال انگیزشی', (A.ice2 || {}).text],
    ['مدل پیشرفته', (A.ice3 || {}).text], ['سؤال‌های «آیا» من', A.aya], ['جواب من به «شغلت چیه؟»', A.job], ['این هفته تمرین می‌کنم', (A.practice || []).join('، ')]];
  f.innerHTML = `<div class="medal" style="margin:10px auto 14px">${svg('crown', 2)}</div><h1>کارت گفت‌وگوی تو</h1>
    <p>${qn ? `در تمرین‌ها ${fa(qok)} از ${fa(qn)} جواب درست دادی. ` : ''}این جمله‌ها را خودت ساختی؛ قبل از هر گفت‌وگو یک بار مرورشان کن.</p>
    ${lines.map(([k, v]) => item(k, v)).join('') || '<div class="item glass"><div class="v">هنوز چیزی ننوشته‌ای. از نقشه‌ی سفر برگرد و تمرین‌ها را پر کن.</div></div>'}
    <div class="item glass"><div class="k">یادت بماند</div><div class="v">خبر بده، منفعت بگو، اختیار بده؛ بعد سکوت کن و بگذار مخاطب سؤال کند.</div></div>
    <div class="acts" style="justify-content:center"><button class="btn" type="button" data-c>کپی متن کارت</button><button class="lnk" type="button" data-p>چاپ / PDF</button><button class="lnk" type="button" data-m>نقشه‌ی سفر</button></div>`;
  document.body.appendChild(f); sfx('ding', .45);
  f.querySelector('[data-c]').onclick = e => { const t = lines.filter(x => x[1]).map(([k, v]) => `${k}:\n${v}`).join('\n\n');
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { e.target.textContent = 'کپی شد ✓'; }).catch(() => { e.target.textContent = 'کپی نشد'; }); };
  f.querySelector('[data-p]').onclick = () => window.print();
  f.querySelector('[data-m]').onclick = () => { f.remove(); $('#mapb').click(); };
}


/* ---------- gold dust (slow, sparse, behind the board) ---------- */
(() => {
  const c = $('#dust'), x = c.getContext('2d'); let W, H; const N = 46, ps = [];
  const fit = () => { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; };
  fit(); addEventListener('resize', fit);
  for (let i = 0; i < N; i++) ps.push({x: Math.random(), y: Math.random(), r: .6 + Math.random() * 1.8, v: .00012 + Math.random() * .0004, a: Math.random() * 6.28});
  const tick = () => { x.clearRect(0, 0, W, H);
    for (const p of ps) { p.y -= p.v; p.a += .01; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); }
      const px = (p.x + Math.sin(p.a) * .01) * W, py = p.y * H, al = .25 + .35 * Math.sin(p.a * 1.7) ** 2;
      x.beginPath(); x.arc(px, py, p.r * devicePixelRatio, 0, 6.28); x.fillStyle = `rgba(244,212,147,${al})`; x.fill(); }
    requestAnimationFrame(tick); };
  tick();
})();


/* ---------- reel gestures (almost every viewer is on a phone): swipe ← next, swipe → previous, tap the narrator = pause ---------- */
(() => {
  let x0 = 0, y0 = 0, t0 = 0;
  const stage = $('#stage');
  stage.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); }, {passive: true});
  stage.addEventListener('touchend', e => {
    if (e.target.closest('button,input,textarea,select,.sheet,.map,.final,.screen')) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - t0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 700) { dx < 0 ? nextB.click() : $('#prev').click(); return; }
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 350 && e.target.closest('#pres')) $('#pp').click();
  }, {passive: true});
  $('#pres').addEventListener('click', e => { if (!('ontouchstart' in window)) $('#pp').click(); });
})();

/* ---------- boot ---------- */
function boot() {
  const resumable = S && S.pos > 0;
  const b = document.createElement('div'); b.className = 'screen';
  b.innerHTML = `<div class="kick">کارگاه تعاملی · مربی روبه‌روی تو</div><h1>هنر گفت‌وگو<br>از اعتماد تا یخ‌شکن</h1>
    <p>سه فصل: پنج ماشه‌ی تصمیم‌گیری، چهارده تکنیک حسن تفاهم، و فرمول‌های یخ‌شکن. وسط راه تمرین می‌کنی و آخرش «کارت گفت‌وگوی خودت» را می‌گیری. صدای دستگاهت را روشن کن.</p>
    <div class="acts">${resumable ? '<button class="btn" type="button" data-c>ادامه از همان‌جا</button><button class="lnk" type="button" data-n>از اول</button>' : '<button class="btn" type="button" data-n>شروع</button>'}</div>`;
  document.body.appendChild(b);
  const start = pos => { b.remove(); if (DATA.music) { bedCh = G[pos].ch; music.src = `media/music/bed${bedCh}.mp3`; music.volume = 0; audioInit(); music.play().catch(() => {}); setMusic(BED); }
    if (IDLES.length) idleV.play().catch(() => {}); go(pos); };
  b.querySelector('[data-n]').onclick = () => { S = fresh(); save(); start(0); };
  if (resumable) b.querySelector('[data-c]').onclick = () => start(S.pos);
}
if (!S) S = fresh();
boot();
</script>
