 رد شده باشی، مخاطب خودش ازت جزئیات می‌خواد.", "t": [0.0, 0.0652, 0.1149, 0.2111, 0.2918, 0.3415, 0.4067, 0.4874, 0.5837, 0.6644, 0.7296, 0.8413, 0.9531]}, {"id": "k1-s08-02", "text": "و این یعنی یه اتفاق بزرگ افتاده: تو نفروختی؛ اون درخواست خرید داده.", "t": [0.0195, 0.0478, 0.1019, 0.1688, 0.21, 0.2897, 0.3567, 0.47, 0.5353, 0.7223, 0.7649, 0.848, 0.9007, 0.9534]}, {"id": "k1-s08-03", "text": "تفاوتش ظریفه، ولی بنیادیه.", "t": [0.0556, 0.3169, 0.5781, 0.685, 0.8938]}, {"id": "k1-s08-04", "text": "وقتی مخاطب خودش سؤال می‌کنه، خودش جزئیات می‌خواد و خودش درخواست می‌ده، یعنی هر پنج ماشه درست فعال شدن.", "t": [0.0282, 0.0753, 0.1315, 0.1786, 0.2257, 0.3, 0.3409, 0.3976, 0.4543, 0.4716, 0.5126, 0.5771, 0.6446, 0.6962, 0.7279, 0.7696, 0.8212, 0.8728, 0.9244, 0.966]}, {"id": "k1-s08-05", "text": "این همون لحظه‌ایه که یه مشاور حرفه‌ای براش کار می‌کنه.", "t": [0.041, 0.1117, 0.1992, 0.3373, 0.3912, 0.4451, 0.5494, 0.6707, 0.7582, 0.8289, 0.9333]}, {"id": "k1-s08-06", "text": "بیا پنج ماشه رو یه بار دیگه مرور کنیم.", "t": [0.069, 0.1536, 0.2382, 0.343, 0.4074, 0.4719, 0.5565, 0.6612, 0.766, 0.8707]}, {"id": "k1-s08-07", "text": "ماشه‌ی اول، شناخت اولیه‌ست: تصویر ذهنی و حس اولیه‌ی مخاطب.", "t": [0.0336, 0.1321, 0.1988, 0.2973, 0.4747, 0.5737, 0.6568, 0.692, 0.7431, 0.8582, 0.9572]}, {"id": "k1-s08-08", "text": "ماشه‌ی دوم، اعتماده، با هشتاد درصد سهم: طلایی‌ترین و مهم‌ترین مرحله.", "t": [0.0258, 0.1207, 0.2065, 0.3526, 0.3922, 0.4687, 0.533, 0.6358, 0.7573, 0.7835, 0.8811, 0.955]}, {"id": "k1-s08-09", "text": "ماشه‌ی سوم، جذابیت پیشنهاده: ارتباطش با درد و خواسته‌ی مخاطب.", "t": [0.0315, 0.136, 0.2299, 0.3448, 0.5538, 0.6569, 0.6971, 0.7499, 0.7776, 0.8806, 0.9586]}, {"id": "k1-s08-10", "text": "ماشه‌ی چهارم، اراده و انتخابه: مالکیت ذهنی و انگیزه‌ی اقدام.", "t": [0.0269, 0.1158, 0.2331, 0.3149, 0.3439, 0.5147, 0.6248, 0.7043, 0.7379, 0.8633, 0.9581]}, {"id": "k1-s08-11", "text": "و ماشه‌ی پنجم، درخواست جزئیاته: جایی که مخاطب خودش درخواست می‌کنه.", "t": [0.0273, 0.0608, 0.1552, 0.253, 0.3847, 0.5872, 0.6462, 0.6824, 0.7527, 0.8117, 0.9046, 0.9749]}]}, {"id": "k1-s09", "ch": 1, "title": "سهم هر ماشه توی تصمیم", "eyebrow": "فصل اول · قلب تصمیم‌گیری", "lines": [{"id": "k1-s09-01", "text": "حالا سهم هر کدوم از این ماشه‌ها توی تصمیم چقدره؟", "t": [0.0, 0.0977, 0.1766, 0.2368, 0.3345, 0.3946, 0.4735, 0.6088, 0.6877, 0.8042, 0.9207]}, {"id": "k1-s09-02", "text": "تقریبا هشتاد درصدش به اعتماد مربوطه.", "t": [0.0289, 0.1961, 0.34, 0.484, 0.5583, 0.7255, 0.8927]}, {"id": "k1-s09-03", "text": "حدود دوازده درصد مربوط به جذابیت و خواستنه، و باقیش مربوط به جزئیات.", "t": [0.0162, 0.0839, 0.1775, 0.2452, 0.3259, 0.3675, 0.4612, 0.4898, 0.6306, 0.6587, 0.7378, 0.8169, 0.8577, 0.9495]}, {"id": "k1-s09-04", "text": "نمودار دقیق جزوه این سهم‌ها رو این‌طوری نشون می‌ده:", "t": [0.0276, 0.1544, 0.246, 0.3376, 0.4115, 0.5207, 0.5771, 0.7215, 0.8131, 0.9047]}, {"id": "k1-s09-05", "text": "اعتماد، یعنی ماشه‌ی دوم، هشتاد درصد.", "t": [0.0329, 0.2672, 0.3844, 0.5242, 0.654, 0.7973, 0.9176]}, {"id": "k1-s09-06", "text": "جذابیت و خواستن، یعنی ماشه‌های سوم و چهارم، دوازده درصد.", "t": [0.0, 0.119, 0.1554, 0.2745, 0.3604, 0.496, 0.5654, 0.6018, 0.7454, 0.8617, 0.9457]}, {"id": "k1-s09-07", "text": "جزئیات، یعنی ماشه‌ی پنجم، پنج درصد.", "t": [0.0, 0.2071, 0.34, 0.4985, 0.6954, 0.7951, 0.9187]}, {"id": "k1-s09-08", "text": "و شناخت اولیه، یعنی ماشه‌ی اول، سه درصد.", "t": [0.0, 0.0579, 0.2209, 0.4195, 0.5198, 0.6394, 0.7555, 0.8221, 0.9303]}, {"id": "k1-s09-09", "text": "پس نتیجه‌ی کلیدی اینه: تمرکز اصلی ما باید روی اعتماد باشه.", "t": [0.0, 0.0469, 0.1525, 0.2434, 0.3945, 0.4927, 0.575, 0.6256, 0.708, 0.7744, 0.8884, 0.9707]}]}, {"id": "k1-s10", "ch": 1, "title": "فلسفه‌ی بنیادین گفت‌وگو در نتورک", "eyebrow": "فصل اول · قلب تصمیم‌گیری", "lines": [{"id": "k1-s10-01", "text": "خب، کار ما دقیقا چیه؟", "t": [0.0, 0.1382, 0.3139, 0.4477, 0.7069, 0.8825]}, {"id": "k1-s10-02", "text": "ما وارد گفت‌وگو می‌شیم، اعتماد می‌سازیم، نیاز رو کشف می‌کنیم، پیشنهاد می‌دیم، و مخاطب رو به تصمیم می‌رسونیم.", "t": [0.0172, 0.0467, 0.0946, 0.1609, 0.218, 0.2844, 0.376, 0.423, 0.452, 0.49, 0.581, 0.6501, 0.717, 0.7342, 0.7826, 0.8076, 0.8326, 0.881, 0.9529]}, {"id": "k1-s10-03", "text": "ولی سه تا اصل رو هیچ‌وقت فراموش نکن.", "t": [0.0763, 0.1684, 0.2387, 0.3089, 0.4011, 0.4713, 0.6293, 0.7874, 0.8795]}, {"id": "k1-s10-04", "text": "نه اجبار؛ مخاطب حق انتخاب آزاد داره.", "t": [0.0499, 0.1235, 0.3843, 0.5056, 0.5682, 0.7091, 0.8109, 0.9127]}, {"id": "k1-s10-05", "text": "نه فشار؛ انرژی فشاردهنده اعتماد رو از بین می‌بره.", "t": [0.0308, 0.0949, 0.2865, 0.3865, 0.5511, 0.6672, 0.7188, 0.7704, 0.8382, 0.9382]}, {"id": "k1-s10-06", "text": "و نه تعقیب بی‌هدف؛ پیگیری هدفمند، نه پافشاری.", "t": [0.025, 0.068, 0.1305, 0.2517, 0.4385, 0.5763, 0.7442, 0.7949, 0.9249]}, {"id": "k1-s10-07", "text": "این فلسفه، پایه و اساس هر گفت‌وگوی موفق توی نتورک مارکتینگه.", "t": [0.0321, 0.1027, 0.2237, 0.2975, 0.3287, 0.4024, 0.4478, 0.5642, 0.638, 0.6976, 0.7855, 0.9302]}, {"id": "k1-s10-08", "text": "وقتی این سه تا اصل رو درونی کنیم، نه‌تنها نتیجه‌های بهتری می‌گیریم، بلکه رابطه‌های انسانی سالم‌تر و پایدارتری هم می‌سازیم.", "t": [0.022, 0.0568, 0.0848, 0.1062, 0.1276, 0.1557, 0.1771, 0.2185, 0.2762, 0.3327, 0.4049, 0.4536, 0.5471, 0.5903, 0.6667, 0.7264, 0.7862, 0.8044, 0.8891, 0.9157, 0.9837]}]}, {"id": "k2-s01", "ch": 2, "title": "پیش از تحلیل، ذهن تصمیم می‌گیره", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s01-01", "text": "توی نتورک مارکتینگ، تصمیم‌گیری توی سطح منطق اتفاق نمی‌افته. تصمیم‌گیری از کانال ضمیر ناخودآگاه رد می‌شه.", "t": [0.0, 0.0355, 0.0878, 0.1786, 0.2719, 0.3103, 0.3487, 0.3963, 0.453, 0.5834, 0.6733, 0.7015, 0.7561, 0.8019, 0.8918, 0.92, 0.9659]}, {"id": "k2-s01-02", "text": "مخاطب قبل از اینکه تحلیل کنه، قبل از اینکه حساب‌وکتاب کنه، و قبل از اینکه پرزنت کامل بشه، توی ناخودآگاهش تصمیمش رو گرفته.", "t": [0.0276, 0.0756, 0.1081, 0.1328, 0.1808, 0.2288, 0.2819, 0.3128, 0.3364, 0.382, 0.457, 0.4879, 0.5041, 0.535, 0.5586, 0.6042, 0.6498, 0.688, 0.7292, 0.7607, 0.8445, 0.8984, 0.9224, 0.9688]}, {"id": "k2-s01-03", "text": "اگه این بخش رو نفهمیم، بهترین پلن هم رد می‌شه.", "t": [0.0678, 0.146, 0.2242, 0.3024, 0.362, 0.4961, 0.6302, 0.7085, 0.7681, 0.8277, 0.9245]}, {"id": "k2-s01-04", "text": "قانون اول اینه: هر حرفی که می‌زنیم، از چند تا فیلتر ذهنی رد می‌شه.", "t": [0.0475, 0.1127, 0.157, 0.2841, 0.3274, 0.3978, 0.4411, 0.5385, 0.5818, 0.6386, 0.6819, 0.7658, 0.8361, 0.8794, 0.9498]}, {"id": "k2-s01-05", "text": "اگه از این فیلترها رد نشه، جواب ذهنی مخاطب می‌شه «نه».", "t": [0.0507, 0.1084, 0.1523, 0.2099, 0.3225, 0.3664, 0.4679, 0.5668, 0.6657, 0.7837, 0.8826, 0.9435]}, {"id": "k2-s01-06", "text": "امروز این فیلترها رو می‌شناسیم، و یاد می‌گیریم چطوری ازشون عبور کنیم.", "t": [0.0523, 0.1333, 0.1881, 0.2951, 0.3369, 0.4889, 0.5172, 0.5713, 0.6769, 0.7567, 0.8366, 0.9035, 0.9705]}]}, {"id": "k2-s02", "ch": 2, "title": "فیلتر اول: هشدار فروشنده", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s02-01", "text": "مهم‌ترین فیلتر، هشدار فروشنده‌ست.", "t": [0.0, 0.243, 0.461, 0.6345, 0.9199]}, {"id": "k2-s02-02", "text": "ضمیر ناخودآگاه مخاطب مثل یه نگهبان عمل می‌کنه. به‌محض اینکه حس کنه طرف مقابل فروشنده‌ست، دکمه‌ی قرمز رو می‌زنه، و نتیجه می‌شه: نه.", "t": [0.0181, 0.0555, 0.129, 0.1736, 0.2039, 0.2269, 0.2788, 0.3091, 0.3983, 0.44, 0.4818, 0.5034, 0.5317, 0.56, 0.6017, 0.6705, 0.7122, 0.7473, 0.7688, 0.8196, 0.8355, 0.8802, 0.9306, 0.9688]}, {"id": "k2-s02-03", "text": "آدم‌ها از اینکه چیزی بهشون فروخته بشه متنفرن، ولی عاشق خرید کردنن.", "t": [0.0414, 0.1167, 0.1556, 0.2309, 0.2941, 0.3694, 0.4569, 0.5079, 0.6427, 0.7032, 0.7782, 0.8531, 0.9424]}, {"id": "k2-s02-04", "text": "حالا فروشنده توی ذهن مخاطب چه شکلیه؟", "t": [0.0791, 0.1957, 0.3796, 0.4739, 0.5681, 0.7071, 0.7789, 0.918]}, {"id": "k2-s02-05", "text": "تند و بی‌وقفه حرف می‌زنه، زیاد از خودش تعریف می‌کنه، منفعت شخصیش معلومه، عجله داره، اصرار می‌کنه و اختیار نمی‌ده.", "t": [0.0216, 0.0563, 0.0745, 0.134, 0.1687, 0.2484, 0.2823, 0.3032, 0.3371, 0.3776, 0.4473, 0.5034, 0.5594, 0.6519, 0.6916, 0.7565, 0.8037, 0.851, 0.8678, 0.9227, 0.97]}, {"id": "k2-s02-06", "text": "خرید کردن یعنی انتخاب، یعنی حس قدرت و اختیار توی تصمیم.", "t": [0.038, 0.1158, 0.1936, 0.2714, 0.3975, 0.4823, 0.5345, 0.6194, 0.6553, 0.7728, 0.8414, 0.9425]}, {"id": "k2-s02-07", "text": "فروخته شدن یعنی فشار، حس اجبار، و از دست دادن اختیار.", "t": [0.0427, 0.1498, 0.2123, 0.2896, 0.4128, 0.4746, 0.6355, 0.6668, 0.7123, 0.772, 0.8459, 0.9482]}, {"id": "k2-s02-08", "text": "اصل اجرایی ما اینه: ما فروشنده نیستیم؛ ما مشاور حل مسئله‌ایم.", "t": [0.0338, 0.0853, 0.1738, 0.2131, 0.3334, 0.3753, 0.4828, 0.6227, 0.6708, 0.7639, 0.8119, 0.9501]}, {"id": "k2-s02-09", "text": "قبل از هر گفت‌وگو از خودت بپرس: آیا عجله دارم؟ آیا دارم فشار میارم؟", "t": [0.034, 0.0769, 0.1095, 0.1421, 0.2155, 0.2482, 0.3012, 0.4062, 0.4587, 0.5237, 0.6414, 0.7067, 0.7875, 0.8683, 0.9646]}, {"id": "k2-s02-10", "text": "آیا بیشتر حرف می‌زنم یا بیشتر گوش می‌دم؟ آیا منفعت خودم پررنگ‌تره یا منفعت اون؟", "t": [0.0211, 0.0643, 0.128, 0.1712, 0.2349, 0.2678, 0.3315, 0.3747, 0.4858, 0.5378, 0.6146, 0.679, 0.7929, 0.8325, 0.9093, 0.9613]}, {"id": "k2-s02-11", "text": "اگه منفعت تو پررنگ‌تر باشه، هشدار فروشنده روشن می‌شه.", "t": [0.0398, 0.1148, 0.2255, 0.2826, 0.429, 0.5712, 0.6705, 0.8018, 0.8851, 0.9683]}]}, {"id": "k2-s03", "ch": 2, "title": "فیلتر دوم: این‌قدر خوبه که نمی‌شه باورش کرد", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s03-01", "text": "وقتی بیش از حد تعریف می‌کنیم و می‌گیم بهترین، خفن‌ترین، بی‌نقص‌ترین، ذهن مخاطب شک می‌کنه.", "t": [0.0, 0.0463, 0.0836, 0.1121, 0.1406, 0.1957, 0.2598, 0.2793, 0.3345, 0.4153, 0.5725, 0.7776, 0.8156, 0.8717, 0.9007, 0.9568]}, {"id": "k2-s03-02", "text": "ناخودآگاهش می‌گه: «هیچ‌چیز کامل نیست.»", "t": [0.0691, 0.2894, 0.5062, 0.6732, 0.7937, 0.9143]}, {"id": "k2-s03-03", "text": "پس این حرف‌ها از فیلتر رد نمی‌شن.", "t": [0.0669, 0.149, 0.2568, 0.4159, 0.498, 0.6571, 0.7392, 0.8983]}, {"id": "k2-s03-04", "text": "هر ادعای اغراق‌آمیزی، نه‌تنها قانع نمی‌کنه، بلکه اعتمادی رو هم که ساختی از بین می‌بره.", "t": [0.0212, 0.0733, 0.1742, 0.3727, 0.4276, 0.4673, 0.5415, 0.5917, 0.6707, 0.7016, 0.7324, 0.7633, 0.8231, 0.8539, 0.8944, 0.9542]}, {"id": "k2-s03-05", "text": "خب، راهکار حرفه‌ای چیه؟", "t": [0.0787, 0.1984, 0.4677, 0.737, 0.8941]}, {"id": "k2-s03-06", "text": "اغراق نکن؛ واقع‌بینانه صحبت کن. داده‌های واقعی قوی‌تر از شعارن.", "t": [0.026, 0.1133, 0.2233, 0.3792, 0.4515, 0.5399, 0.6526, 0.7378, 0.823, 0.867, 0.9521]}, {"id": "k2-s03-07", "text": "شعار نده؛ جمله‌های کلیشه‌ای اعتماد رو کم می‌کنن، نه زیاد.", "t": [0.0336, 0.1233, 0.2583, 0.3812, 0.504, 0.6119, 0.6598, 0.7078, 0.8291, 0.8748, 0.9492]}, {"id": "k2-s03-08", "text": "و بذار مخاطب خودش نتیجه بگیره؛ اختیار تصمیم باید دست مخاطب باشه.", "t": [0.0254, 0.0527, 0.1171, 0.1939, 0.2584, 0.3352, 0.4841, 0.5827, 0.6676, 0.7388, 0.7963, 0.8811, 0.9523]}, {"id": "k2-s03-09", "text": "اصل طلایی اینه: هرچی کمتر ادعا کنی، بیشتر باورت می‌کنن.", "t": [0.029, 0.0887, 0.1768, 0.3147, 0.4122, 0.5097, 0.6072, 0.7076, 0.7954, 0.8831, 0.9709]}]}, {"id": "k2-s04", "ch": 2, "title": "فیلتر سوم: تجربه‌های منفی گذشته", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s04-01", "text": "بعضی وقت‌ها کاری از دستمون برنمیاد.", "t": [0.0, 0.1318, 0.289, 0.4209, 0.502, 0.6846, 0.8925]}, {"id": "k2-s04-02", "text": "مخاطب قبلا تجربه‌ی بدی داشته؛ شاید با یه نتورکر سمج، شاید با یه فروشنده‌ی فشاردهنده، شاید با یه پروژه‌ی ضعیف. و حالا حساسه.", "t": [0.022, 0.0666, 0.104, 0.1558, 0.186, 0.2732, 0.3113, 0.3347, 0.3581, 0.4107, 0.4515, 0.4883, 0.5109, 0.5336, 0.5987, 0.6709, 0.7077, 0.7304, 0.753, 0.804, 0.8773, 0.8929, 0.9297, 0.9735]}, {"id": "k2-s04-03", "text": "این حساسیت کاملا طبیعی و قابل درکه، و باید با احترام و همدلی باهاش برخورد کنی.", "t": [0.0307, 0.0836, 0.1742, 0.2522, 0.3303, 0.3579, 0.4234, 0.514, 0.5364, 0.5894, 0.6221, 0.6956, 0.718, 0.7812, 0.8445, 0.918, 0.9608]}, {"id": "k2-s04-04", "text": "اصل مهم اینه: تو نمی‌تونی گذشته‌ش رو پاک کنی، ولی می‌تونی متفاوت باشی.", "t": [0.0327, 0.0871, 0.1416, 0.2692, 0.3037, 0.3921, 0.4697, 0.5042, 0.5495, 0.6285, 0.6863, 0.7853, 0.8844, 0.9559]}, {"id": "k2-s04-05", "text": "نه اینکه بگی متفاوتی؛ واقعا متفاوت باش.", "t": [0.0437, 0.1017, 0.2141, 0.2902, 0.5036, 0.6591, 0.8396, 0.945]}, {"id": "k2-s04-06", "text": "حالا تفاوت واقعی یعنی چی؟", "t": [0.0508, 0.2246, 0.4319, 0.6392, 0.813, 0.92]}, {"id": "k2-s04-07", "text": "یعنی پیگیری حرفه‌ای، نه پافشاری. پیگیری نشونه‌ی احترام و جدیته؛ پافشاری سمیه که رابطه رو از بین می‌بره.", "t": [0.0154, 0.059, 0.1195, 0.2058, 0.2303, 0.3435, 0.4054, 0.4674, 0.5293, 0.5482, 0.637, 0.707, 0.7513, 0.7786, 0.8315, 0.8588, 0.8861, 0.9219, 0.9748]}, {"id": "k2-s04-08", "text": "یعنی یادآوری محترمانه، نه تعقیب. یادآوری با فاصله و احترام انجام می‌شه؛ تعقیب کردن، مخاطب رو فراری می‌ده.", "t": [0.0182, 0.0662, 0.1418, 0.2475, 0.2718, 0.3302, 0.4016, 0.4294, 0.4834, 0.5026, 0.5653, 0.6193, 0.7011, 0.7615, 0.824, 0.8689, 0.8921, 0.937, 0.9747]}, {"id": "k2-s04-09", "text": "یعنی اختیار دادن، نه گرفتن اختیار. اگه مخاطب حس کنه اختیار نداره، ذهنش بسته می‌شه و هیچ پیشرفتی اتفاق نمی‌افته.", "t": [0.0168, 0.0611, 0.1225, 0.183, 0.2094, 0.2605, 0.3694, 0.4014, 0.4487, 0.4732, 0.5052, 0.5602, 0.6167, 0.6586, 0.7005, 0.7424, 0.7601, 0.794, 0.86, 0.91, 0.9761]}, {"id": "k2-s04-10", "text": "پیگیری خوبه؛ پافشاری سمه. اگه مخاطب حس کنه اختیار نداره، ذهنش بسته می‌شه.", "t": [0.022, 0.1015, 0.2103, 0.3308, 0.4552, 0.4981, 0.5614, 0.594, 0.6369, 0.7104, 0.7869, 0.8508, 0.9148, 0.9787]}]}, {"id": "k2-s05", "ch": 2, "title": "فیلتر چهارم: ساختار از پیش تعیین‌شده، یا اَجِندا", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s05-01", "text": "ذهن مخاطب از نقشه‌ی پنهانی متنفره.", "t": [0.0, 0.112, 0.2773, 0.3626, 0.5278, 0.7198, 0.9117]}, {"id": "k2-s05-02", "text": "اگه حس کنه از قبل برنامه چیدی که آخرش به «بله» برسه، باز هم دکمه‌ی نه روشن می‌شه.", "t": [0.0279, 0.0788, 0.1175, 0.1684, 0.2072, 0.2581, 0.3453, 0.4083, 0.4471, 0.5101, 0.5488, 0.5997, 0.6906, 0.7302, 0.7604, 0.8188, 0.849, 0.898, 0.9471]}, {"id": "k2-s05-03", "text": "این یکی از خطرناک‌ترین دام‌هاییه که فروشنده‌ها و نتورکرها توش می‌افتن.", "t": [0.0379, 0.0928, 0.1478, 0.1896, 0.3361, 0.4564, 0.4982, 0.6316, 0.6604, 0.7807, 0.8356, 0.9298]}, {"id": "k2-s05-04", "text": "یه مثال خطرناک بزنم: بعد از سال‌ها به یه دوست زنگ بزنی، حال‌واحوال کنی، چند تا قرار بذاری، رابطه گرم بشه، و بعد تازه پرزنت کنی.", "t": [0.0219, 0.0425, 0.076, 0.1223, 0.1926, 0.2237, 0.2475, 0.2934, 0.3171, 0.3408, 0.3793, 0.4104, 0.449, 0.5245, 0.5556, 0.5867, 0.6105, 0.649, 0.6949, 0.7408, 0.772, 0.8241, 0.8389, 0.8671, 0.902, 0.9436, 0.9718]}, {"id": "k2-s05-05", "text": "وقتی بفهمه از اول برنامه داشتی، می‌گه: «پس این مهربونی برنامه بود؟» و همه‌چیز خراب می‌شه.", "t": [0.0236, 0.0879, 0.1646, 0.2042, 0.2562, 0.3452, 0.4671, 0.5064, 0.5306, 0.5623, 0.6243, 0.6787, 0.7539, 0.7767, 0.851, 0.9047, 0.9584]}, {"id": "k2-s05-06", "text": "خب، اصل طلایی چیه؟", "t": [0.0682, 0.2118, 0.4003, 0.6785, 0.867]}, {"id": "k2-s05-07", "text": "اگه قراره «نه» بشنوی، زودتر بشنو.", "t": [0.0489, 0.2225, 0.4786, 0.6529, 0.7466, 0.84, 0.9184]}, {"id": "k2-s05-08", "text": "شفاف باش، مستقیم باش، و طبیعی باش. رابطه‌ی مصنوعی خطرناکه.", "t": [0.0215, 0.1154, 0.2075, 0.3142, 0.3765, 0.4091, 0.501, 0.5991, 0.7109, 0.8228, 0.9502]}, {"id": "k2-s05-09", "text": "صداقت از همون اول، یه پایه‌ی محکم برای یه رابطه‌ی واقعی می‌سازه.", "t": [0.0266, 0.1208, 0.1694, 0.2484, 0.3122, 0.3608, 0.455, 0.534, 0.613, 0.6616, 0.771, 0.8652, 0.9746]}]}, {"id": "k2-s06", "ch": 2, "title": "یه سوءتفاهم مهم درباره‌ی اعتماد", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s06-01", "text": "بعضی‌ها می‌گن برای اعتماد، کافیه صادق باشیم.", "t": [0.0, 0.1568, 0.27, 0.3832, 0.54, 0.675, 0.7882, 0.9232]}, {"id": "k2-s06-02", "text": "ولی اگه فقط صداقت کافی بود، کلاه‌برداری وجود داشت؟", "t": [0.0602, 0.1352, 0.2102, 0.2852, 0.3958, 0.4887, 0.5637, 0.7636, 0.8565, 0.9493]}, {"id": "k2-s06-03", "text": "کلاه‌بردار هم اعتماد می‌گیره، ولی صداقت نداره. پس اعتماد آنی فقط از صداقت نمیاد.", "t": [0.0288, 0.1257, 0.156, 0.2244, 0.3213, 0.3642, 0.4276, 0.5533, 0.592, 0.6793, 0.7302, 0.7811, 0.8198, 0.895, 0.9701]}, {"id": "k2-s06-04", "text": "اعتماد آنی از چهار تا چیز میاد.", "t": [0.0656, 0.2527, 0.3619, 0.445, 0.5802, 0.6633, 0.7725, 0.9076]}, {"id": "k2-s06-05", "text": "انرژی: انرژی‌ای که توی اولین لحظه‌ها منتقل می‌کنی، از هر کلمه‌ای اثرش بیشتره.", "t": [0.035, 0.1936, 0.2866, 0.3229, 0.3705, 0.4408, 0.5224, 0.5927, 0.663, 0.6992, 0.7355, 0.8171, 0.8761, 0.9577]}, {"id": "k2-s06-06", "text": "زبان بدن: حرکت‌ها، حالت‌های چهره و ژست‌هات، پیام‌هایی قوی‌تر از کلمه‌ها می‌فرستن.", "t": [0.0365, 0.1098, 0.2273, 0.3622, 0.4489, 0.5039, 0.5272, 0.6033, 0.7006, 0.7662, 0.8, 0.8761, 0.9629]}, {"id": "k2-s06-07", "text": "نیت منتقل‌شده: نیت واقعیت، از راه لحن و رفتارت، قبل از کلمه‌ها به مخاطب می‌رسه.", "t": [0.0309, 0.0838, 0.2561, 0.3213, 0.4513, 0.4882, 0.5367, 0.5852, 0.6106, 0.7093, 0.7447, 0.7717, 0.8324, 0.8593, 0.9116, 0.9638]}, {"id": "k2-s06-08", "text": "و آرامش: آرامش درونیت، توی مخاطب حس امنیت می‌سازه و زمینه‌ی اعتماد رو فراهم می‌کنه.", "t": [0.0318, 0.0651, 0.2096, 0.2879, 0.3925, 0.4332, 0.4933, 0.5243, 0.5844, 0.6542, 0.6755, 0.7453, 0.8151, 0.8461, 0.9062, 0.9663]}, {"id": "k2-s06-09", "text": "اعتماد آنی از حس اولیه میاد؛ از انرژی، از زبان بدن، از نیت منتقل‌شده، از آرامش.", "t": [0.0303, 0.1034, 0.146, 0.1785, 0.211, 0.274, 0.3584, 0.3949, 0.4865, 0.5252, 0.5879, 0.6387, 0.6773, 0.728, 0.8663, 0.9034, 0.9752]}, {"id": "k2-s06-10", "text": "و این اتفاق، توی همون ثانیه‌های اول می‌افته.", "t": [0.0544, 0.1005, 0.1885, 0.3427, 0.4292, 0.5363, 0.7258, 0.8123, 0.9606]}]}, {"id": "k2-s07", "ch": 2, "title": "مهارت شماره‌ی یک: ایجاد حسن تفاهم", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s07-01", "text": "گفتیم توی نتورک مارکتینگ، تصمیم‌گیری مخاطب از مسیر ناخودآگاه رد می‌شه.", "t": [0.0, 0.0746, 0.1251, 0.1996, 0.3333, 0.4805, 0.57, 0.6162, 0.6912, 0.8384, 0.8846, 0.9596]}, {"id": "k2-s07-02", "text": "پس اولین مأموریت ما توی شروع گفت‌وگو اینه که توی ثانیه‌های اول، اعتماد آنی بسازیم.", "t": [0.0301, 0.0653, 0.1334, 0.2234, 0.2586, 0.3047, 0.3618, 0.4408, 0.4979, 0.5331, 0.5792, 0.6802, 0.7465, 0.8305, 0.8795, 0.9635]}, {"id": "k2-s07-03", "text": "اسم این مهارت، ایجاد حسن تفاهمه.", "t": [0.0703, 0.1641, 0.2579, 0.436, 0.6052, 0.7199, 0.9164]}, {"id": "k2-s07-04", "text": "حسن تفاهم یعنی کاری کنیم که ناخودآگاه مخاطب بگه: «این آدم مثل منه... شبیه منه... با من هم‌جهته.»", "t": [0.0298, 0.0649, 0.1166, 0.16, 0.2033, 0.2467, 0.2734, 0.3585, 0.4103, 0.4953, 0.5328, 0.5702, 0.6077, 0.6599, 0.7306, 0.8288, 0.8607, 0.8927, 0.9645]}, {"id": "k2-s07-05", "text": "وقتی ناخودآگاه گفت «مثل منه»، اعتماد روشن می‌شه. وقتی گفت «مثل من نیست»، اعتماد خاموش می‌شه.", "t": [0.0332, 0.0862, 0.1901, 0.2329, 0.2757, 0.3439, 0.4061, 0.451, 0.5532, 0.6059, 0.6485, 0.6911, 0.7236, 0.8069, 0.8698, 0.9239, 0.9693]}, {"id": "k2-s07-06", "text": "قانون طلایی حسن تفاهم اینه: حسن تفاهم به کلمه‌ها حساسه، ولی بیشتر از کلمه‌ها، به حس وابسته‌ست.", "t": [0.0267, 0.0794, 0.132, 0.1677, 0.2204, 0.321, 0.3627, 0.4243, 0.4561, 0.5277, 0.6254, 0.6672, 0.729, 0.7608, 0.8469, 0.8729, 0.8989, 0.9737]}, {"id": "k2-s07-07", "text": "اگه مخاطب کنارت حس ناامنی بگیره، اگه محکم نباشی، اگه تته‌پته کنی، یا اگه معلوم باشه توی ذهنت دنبال جمله‌ی بعدی می‌گردی، حسن تفاهم شکل نمی‌گیره.", "t": [0.0173, 0.0453, 0.0868, 0.1282, 0.1496, 0.1977, 0.2619, 0.2903, 0.3254, 0.3892, 0.4159, 0.4617, 0.5087, 0.5267, 0.5504, 0.5853, 0.6146, 0.6382, 0.6675, 0.7024, 0.7373, 0.7666, 0.8319, 0.8586, 0.8979, 0.9246, 0.9767]}, {"id": "k2-s07-08", "text": "اول حس رو بساز، بعد کلمه‌ها رو بگو.", "t": [0.0725, 0.185, 0.2706, 0.3563, 0.5521, 0.6316, 0.7678, 0.8283, 0.9077]}, {"id": "k2-s07-09", "text": "حالا چهار ستون اصلی حسن تفاهم چیه؟", "t": [0.0845, 0.2059, 0.3273, 0.4487, 0.57, 0.6681, 0.8128, 0.9109]}, {"id": "k2-s07-10", "text": "یک، واقعیت مشترک یا فکت: گفتن یه حقیقت قابل قبول برای هر دو طرف، که مقاومت ایجاد نکنه.", "t": [0.0326, 0.0669, 0.1648, 0.2491, 0.2926, 0.3854, 0.4324, 0.4613, 0.5173, 0.5643, 0.6113, 0.6583, 0.6872, 0.7161, 0.7806, 0.8084, 0.8708, 0.9245, 0.9696]}, {"id": "k2-s07-11", "text": "دو، همراهی: هم‌حال شدن با مخاطب، و فرستادن این پیام که «من تو رو می‌فهمم.»", "t": [0.0342, 0.1213, 0.2672, 0.3369, 0.3841, 0.4201, 0.5182, 0.5426, 0.6336, 0.6803, 0.738, 0.7735, 0.809, 0.8445, 0.88, 0.96]}, {"id": "k2-s07-12", "text": "سه، واقعیت دوم: یه تأیید دیگه، برای محکم‌تر کردن مسیر موافقت توی ناخودآگاه مخاطب.", "t": [0.0311, 0.1086, 0.1975, 0.2899, 0.3234, 0.3882, 0.4426, 0.4971, 0.5724, 0.6268, 0.6812, 0.7565, 0.8005, 0.9072, 0.9721]}, {"id": "k2-s07-13", "text": "چهار، لبخند: لبخند طبیعی‌ای که حس امنیت و اعتماد آنی می‌سازه.", "t": [0.0357, 0.1502, 0.3175, 0.4009, 0.5112, 0.5543, 0.5973, 0.6807, 0.7103, 0.8072, 0.8637, 0.9605]}, {"id": "k2-s07-14", "text": "نه تکنیک بعدی هم همین چهار تا ستون رو قوی‌تر می‌کنن، و ابزارهای عملی برای اجراشون رو بهت می‌دن.", "t": [0.0313, 0.0625, 0.1229, 0.1735, 0.2047, 0.2553, 0.306, 0.3372, 0.3878, 0.419, 0.4794, 0.5747, 0.5957, 0.6832, 0.7326, 0.7821, 0.8601, 0.8905, 0.9305, 0.9799]}]}, {"id": "k2-s08", "ch": 2, "title": "تکنیک اول: بیان یه واقعیت یا فکت", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s08-01", "text": "فکت یعنی یه حقیقتی که تو قبولش داری، مخاطب هم قبولش داره، و روش مقاومتی نداره.", "t": [0.0, 0.047, 0.1053, 0.1411, 0.2217, 0.2575, 0.2934, 0.3628, 0.4716, 0.5437, 0.5809, 0.653, 0.7134, 0.739, 0.7878, 0.8831, 0.9552]}, {"id": "k2-s08-02", "text": "هدف فکت تأیید گرفتنه، نه قانع کردن. فکت فقط قراره قفل ذهن رو باز کنه.", "t": [0.0283, 0.0877, 0.1471, 0.2348, 0.3594, 0.3964, 0.4565, 0.5827, 0.6281, 0.6736, 0.7408, 0.7862, 0.8317, 0.8664, 0.9118, 0.9573]}, {"id": "k2-s08-03", "text": "تام شرایتر یه جمله‌ی طلایی داره: «دو تا تکون سر بگیر، کارو کردی.»", "t": [0.0423, 0.0947, 0.1845, 0.2244, 0.3017, 0.3791, 0.5335, 0.5752, 0.617, 0.6848, 0.7265, 0.8211, 0.8819, 0.9427]}, {"id": "k2-s08-04", "text": "وقتی فکت می‌گی، ناخودآگاه مخاطب می‌گه: «این حرف آشناست... منطقیه... می‌تونم تأییدش کنم...»", "t": [0.0264, 0.08, 0.1232, 0.1767, 0.2817, 0.3456, 0.4626, 0.5107, 0.5587, 0.6814, 0.8254, 0.8804, 0.9355, 0.9676]}, {"id": "k2-s08-05", "text": "و همین تأیید کوچیک، پایه‌ی اعتماد آنی رو می‌سازه.", "t": [0.0427, 0.0837, 0.1806, 0.296, 0.4379, 0.5461, 0.6718, 0.7451, 0.801, 0.9267]}, {"id": "k2-s08-06", "text": "خب، معیار یه فکت خوب چیه؟", "t": [0.0779, 0.2841, 0.456, 0.5447, 0.6612, 0.7776, 0.8941]}, {"id": "k2-s08-07", "text": "کوتاه باشه، عمومی باشه، قابل قبول باشه، حساسیت ایجاد نکنه، و حس فروش نده.", "t": [0.0309, 0.0998, 0.1862, 0.2587, 0.3444, 0.401, 0.4577, 0.5479, 0.6382, 0.716, 0.8011, 0.8256, 0.8612, 0.919, 0.9658]}, {"id": "k2-s08-08", "text": "بذار توی حوزه‌ی سلامت چند تا نمونه بگم.", "t": [0.0589, 0.1689, 0.2577, 0.3889, 0.52, 0.6089, 0.6765, 0.8077, 0.8965]}, {"id": "k2-s08-09", "text": "سلامت وقتی از دست بره، همه‌چی تحت تأثیر قرار می‌گیره. انرژی پایین، کل روز رو خراب می‌کنه.", "t": [0.028, 0.0901, 0.1422, 0.1742, 0.2163, 0.2584, 0.3205, 0.3626, 0.4247, 0.4768, 0.6072, 0.6743, 0.7561, 0.7862, 0.8258, 0.856, 0.9049, 0.9634]}, {"id": "k2-s08-10", "text": "آدم باید قبل از مریضی به فکر بدنش باشه. کیفیت خواب روی کیفیت زندگی اثر مستقیم داره.", "t": [0.0241, 0.0644, 0.1143, 0.1546, 0.1853, 0.2448, 0.2755, 0.3158, 0.3657, 0.4654, 0.5346, 0.5926, 0.6395, 0.7087, 0.778, 0.8249, 0.9053, 0.9633]}, {"id": "k2-s08-11", "text": "استرس زیاد، بدن رو زودتر فرسوده می‌کنه. بدن اگه مواد خوب نگیره، خودش رو نشون می‌ده.", "t": [0.0247, 0.0957, 0.1553, 0.2034, 0.2401, 0.3111, 0.3936, 0.5174, 0.5607, 0.6041, 0.6577, 0.701, 0.765, 0.8186, 0.8516, 0.9053, 0.9589]}, {"id": "k2-s08-12", "text": "آدم وقتی کم‌انرژی باشه، حتی حوصله‌ی زندگی هم کم می‌شه. همه دنبال این‌ان که کمتر مریض بشن و بیشتر سرحال باشن.", "t": [0.0208, 0.0597, 0.1078, 0.1836, 0.2317, 0.2705, 0.3371, 0.3944, 0.424, 0.4536, 0.5412, 0.5743, 0.6232, 0.6722, 0.6974, 0.7385, 0.7795, 0.8126, 0.83, 0.8789, 0.9279, 0.9689]}, {"id": "k2-s08-13", "text": "حالا توی حوزه‌ی مراقبت پوست:", "t": [0.0795, 0.231, 0.3534, 0.534, 0.7438, 0.8953]}, {"id": "k2-s08-14", "text": "صورت ما، اولین تأثیرگذاری ماست. مردم از چروک پوست متنفرن.", "t": [0.0266, 0.1186, 0.1992, 0.2876, 0.4474, 0.5785, 0.6536, 0.6999, 0.775, 0.8501, 0.9541]}, {"id": "k2-s08-15", "text": "هیچ‌کس دوست نداره پیرتر از سنش دیده بشه. همه دوست دارن پوستشون سالم و شفاف باشه.", "t": [0.0297, 0.0956, 0.1508, 0.2167, 0.2826, 0.3166, 0.3613, 0.4165, 0.5051, 0.5519, 0.6098, 0.6677, 0.7591, 0.817, 0.8415, 0.8995, 0.9574]}, {"id": "k2-s08-16", "text": "وقتی پوست خوب باشه، آرایش کمتر هم کافیه. آدم وقتی به خودش برسه، حس بهتری داره.", "t": [0.0249, 0.0845, 0.144, 0.1921, 0.2516, 0.3226, 0.3821, 0.4188, 0.5407, 0.5882, 0.647, 0.6832, 0.742, 0.8008, 0.837, 0.9071, 0.9659]}, {"id": "k2-s08-17", "text": "پوست خوب یعنی حس تمیزی و مرتب بودن. هیچ‌کس دوست نداره لک و تیرگی رو صورتش بمونه.", "t": [0.0219, 0.0736, 0.1154, 0.1672, 0.199, 0.2607, 0.2826, 0.3344, 0.4006, 0.4787, 0.5442, 0.6223, 0.6626, 0.6904, 0.7685, 0.8088, 0.8869, 0.965]}, {"id": "k2-s08-18", "text": "آدم وقتی عکس می‌گیره، اولین چیزی که توی چشم میاد پوسته. رسیدن به پوست یعنی احترام به خودت.", "t": [0.0212, 0.0624, 0.1135, 0.1547, 0.2396, 0.2976, 0.3462, 0.3761, 0.4153, 0.4546, 0.5032, 0.6063, 0.6697, 0.7024, 0.7555, 0.8087, 0.8823, 0.9151, 0.9682]}, {"id": "k2-s08-19", "text": "توی حوزه‌ی درآمد:", "t": [0.0966, 0.2914, 0.579, 0.8666]}, {"id": "k2-s08-20", "text": "همه‌مون می‌دونیم دو تا درآمد بهتر از یه درآمده. داشتن یه منبع درآمد مستقل، الان برای همه لازمه.", "t": [0.0161, 0.0767, 0.1457, 0.1727, 0.1996, 0.2518, 0.2956, 0.3225, 0.3495, 0.4536, 0.5228, 0.5585, 0.6165, 0.6856, 0.7704, 0.8195, 0.8685, 0.9081, 0.9666]}, {"id": "k2-s08-21", "text": "کاری که ساعت کاریش دست خودت باشه، خیلی ارزشمنده. کاری که توی سفر و بیرون شهر هم بشه انجامش داد، خیلی مهمه.", "t": [0.0189, 0.065, 0.0934, 0.1394, 0.1944, 0.2316, 0.2777, 0.3238, 0.3699, 0.4921, 0.5307, 0.5545, 0.5856, 0.6168, 0.6332, 0.6792, 0.7104, 0.7341, 0.7653, 0.8188, 0.8673, 0.9205, 0.9736]}, {"id": "k2-s08-22", "text": "درآمدی که سقف نداشته باشه جذابه. همه دوست دارن پول بیشتری دربیارن، بدون اینکه زمان بیشتری بفروشن.", "t": [0.0188, 0.0896, 0.121, 0.1624, 0.2332, 0.2843, 0.3864, 0.4237, 0.47, 0.5163, 0.5536, 0.6177, 0.6906, 0.7369, 0.7921, 0.8383, 0.9024, 0.9665]}, {"id": "k2-s08-23", "text": "امنیت مالی، آرامش ذهن میاره. این روزا خیلی‌ها دنبال کار دومن.", "t": [0.0304, 0.1459, 0.265, 0.3493, 0.4064, 0.5502, 0.6033, 0.669, 0.7601, 0.8384, 0.8915, 0.9573]}, {"id": "k2-s08-24", "text": "آدم دوست داره یه کاری داشته باشه که بهش اختیار بده. وقت آزاد یعنی زندگی کردن، نه فقط کار کردن.", "t": [0.0205, 0.0582, 0.1047, 0.1513, 0.18, 0.2266, 0.2822, 0.3288, 0.3574, 0.3951, 0.4596, 0.5093, 0.5515, 0.6038, 0.6561, 0.7184, 0.8, 0.8314, 0.8726, 0.9138, 0.9648]}, {"id": "k2-s08-25", "text": "و توی حوزه‌ی عطر:", "t": [0.1192, 0.2169, 0.4034, 0.6786, 0.8651]}, {"id": "k2-s08-26", "text": "بو خیلی سریع‌تر از ظاهر توی ذهن آدم‌ها می‌مونه. یه رایحه‌ی خوب می‌تونه شخصیت آدم رو نشون بده.", "t": [0.0174, 0.0502, 0.1037, 0.1776, 0.2105, 0.2639, 0.3071, 0.3502, 0.4139, 0.5325, 0.5635, 0.6333, 0.674, 0.7437, 0.8038, 0.8445, 0.8755, 0.9259, 0.9666]}, {"id": "k2-s08-27", "text": "آدم‌ها ناخودآگاه به بوی خوب واکنش مثبت دارن. وقتی بوی خوب می‌دی، حس اعتمادبه‌نفست فرق می‌کنه.", "t": [0.0172, 0.0791, 0.181, 0.213, 0.2549, 0.2969, 0.3588, 0.4108, 0.4967, 0.5423, 0.5791, 0.6159, 0.6825, 0.7158, 0.8533, 0.897, 0.9616]}, {"id": "k2-s08-28", "text": "عطر خوب یعنی امضای حضور. یه رایحه‌ی خاص، آدم رو توی ذهن‌ها ماندگار می‌کنه.", "t": [0.034, 0.0908, 0.1475, 0.2178, 0.3015, 0.4248, 0.4654, 0.5569, 0.645, 0.6859, 0.717, 0.7578, 0.818, 0.8977, 0.958]}, {"id": "k2-s08-29", "text": "هیچ‌کس از بوی خوب بدش نمیاد. بعضی بوها آدم رو یاد یه خاطره‌ی خوب می‌اندازن.", "t": [0.0348, 0.1086, 0.1468, 0.1968, 0.2468, 0.2968, 0.4271, 0.4896, 0.552, 0.6025, 0.641, 0.6914, 0.7299, 0.8164, 0.8669, 0.9774]}]}, {"id": "k2-s09", "ch": 2, "title": "تکنیک دوم: همراهی کردن", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s09-01", "text": "همراهی یعنی هم‌حال شدن؛ نه خیلی بالاتر از طرف، و نه خیلی پایین‌تر.", "t": [0.0, 0.111, 0.1911, 0.2866, 0.4235, 0.462, 0.5245, 0.611, 0.6495, 0.7238, 0.7506, 0.7895, 0.8529, 0.9527]}, {"id": "k2-s09-02", "text": "نکته‌ی کلیدی اینجاست: همراهی یعنی به مخاطب این پیام رو بدی که «من تو رو می‌فهمم»، نه اینکه ازش بالاتر یا پایین‌تر باشی.", "t": [0.0302, 0.0746, 0.119, 0.2119, 0.268, 0.3086, 0.3335, 0.3818, 0.4145, 0.455, 0.48, 0.5127, 0.5376, 0.5626, 0.5875, 0.6124, 0.6996, 0.7231, 0.7686, 0.7994, 0.8523, 0.8758, 0.9359, 0.9741]}, {"id": "k2-s09-03", "text": "همراهی یکی از قوی‌ترین راه‌های خاموش کردن هشدار فروشنده‌ست.", "t": [0.0499, 0.1634, 0.2296, 0.28, 0.4092, 0.5227, 0.6204, 0.7023, 0.8, 0.9608]}, {"id": "k2-s09-04", "text": "چون فروشنده‌ها معمولا با انرژی عجیب، سرعت زیاد، یا لحن فشاردهنده وارد می‌شن. تو باید برعکس عمل کنی.", "t": [0.0221, 0.0601, 0.1524, 0.2176, 0.2466, 0.3027, 0.3598, 0.4296, 0.5109, 0.5376, 0.5727, 0.6579, 0.7013, 0.7952, 0.8192, 0.8582, 0.9047, 0.9363, 0.9678]}, {"id": "k2-s09-05", "text": "حالا توی موقعیت‌های مختلف چطوری همراهی کنی؟", "t": [0.0717, 0.1746, 0.2578, 0.4597, 0.5824, 0.7051, 0.8477, 0.9308]}, {"id": "k2-s09-06", "text": "اگه طرف خسته‌ست، آروم‌تر و همدلانه‌تر صحبت کن؛ یعنی اول حس خستگیش رو بفهم.", "t": [0.0352, 0.0874, 0.1396, 0.2552, 0.3342, 0.3583, 0.4702, 0.5273, 0.6223, 0.6859, 0.7372, 0.7764, 0.8644, 0.9036, 0.9672]}, {"id": "k2-s09-07", "text": "اگه طرف پرانرژیه، ریتمت رو یه کم بالا ببر، نه اینکه کند و بی‌حال باشی.", "t": [0.0413, 0.0625, 0.0837, 0.148, 0.2704, 0.3336, 0.3968, 0.46, 0.5627, 0.6889, 0.7199, 0.78, 0.8207, 0.842, 0.9021, 0.9525]}, {"id": "k2-s09-08", "text": "اگه طرف رسمیه، محترمانه و منظم حرف بزن و شوخی اضافه نکن.", "t": [0.0452, 0.1169, 0.1886, 0.3271, 0.4616, 0.4937, 0.5697, 0.6311, 0.6925, 0.7247, 0.8007, 0.8914, 0.9528]}, {"id": "k2-s09-09", "text": "اگه طرف خودمونیه، گرم‌تر و صمیمی‌تر باش؛ خشک و اداری حرف نزن.", "t": [0.0432, 0.1078, 0.1724, 0.3138, 0.4092, 0.443, 0.5691, 0.698, 0.7498, 0.777, 0.8535, 0.9054, 0.9572]}, {"id": "k2-s09-10", "text": "اگه طرف آهسته حرف می‌زنه، تو هم سرعتت رو تنظیم کن و تندتند جمله نریز.", "t": [0.0396, 0.0942, 0.1489, 0.2295, 0.2841, 0.4037, 0.4434, 0.4831, 0.5601, 0.5998, 0.6767, 0.7164, 0.7437, 0.8331, 0.8976, 0.9621]}, {"id": "k2-s09-11", "text": "اگه طرف سریع حرف می‌زنه، کش‌دار و کند صحبت نکن و حوصله‌ش رو سر نبر.", "t": [0.0376, 0.0906, 0.1436, 0.2092, 0.2622, 0.3774, 0.4631, 0.4935, 0.5516, 0.6235, 0.6816, 0.712, 0.8116, 0.8558, 0.9001, 0.9582]}, {"id": "k2-s09-12", "text": "همراهی جمله نیست؛ حسه. هدف اینه که مخاطب حس کنه باهاش هم‌جهتی.", "t": [0.0363, 0.1446, 0.2228, 0.3357, 0.4921, 0.5433, 0.6067, 0.6456, 0.7212, 0.7602, 0.8113, 0.8869, 0.9746]}]}, {"id": "k2-s10", "ch": 2, "title": "تکنیک سوم: بیان دومین واقعیت", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s10-01", "text": "یه فکت خوبه. دو تا فکت بهتره. چرا؟", "t": [0.0, 0.0652, 0.1507, 0.3533, 0.4244, 0.4954, 0.5887, 0.8215, 0.9225]}, {"id": "k2-s10-02", "text": "چون فکت اول، در رو باز می‌کنه. فکت دوم، اعتماد رو محکم‌تر می‌کنه.", "t": [0.0176, 0.0865, 0.1554, 0.2406, 0.2699, 0.2993, 0.3378, 0.4595, 0.5428, 0.656, 0.7433, 0.7821, 0.8694, 0.9445]}, {"id": "k2-s10-03", "text": "دو تا تأیید پشت سر هم یعنی ناخودآگاه گفته: «اوکی... این آدم شبیه منه.»", "t": [0.0279, 0.0683, 0.1087, 0.187, 0.24, 0.2804, 0.3208, 0.3865, 0.5153, 0.6353, 0.7369, 0.7841, 0.8313, 0.8897, 0.9369]}, {"id": "k2-s10-04", "text": "نکته‌ی اصلی اینجاست: تو قبل از اینکه چیزی پیشنهاد بدی، باید ذهن مخاطب رو ببری توی حالت تأیید.", "t": [0.0241, 0.0785, 0.1241, 0.2434, 0.2743, 0.3149, 0.3458, 0.4057, 0.4559, 0.5351, 0.5757, 0.6259, 0.6665, 0.7264, 0.7573, 0.8076, 0.8481, 0.8984, 0.9583]}, {"id": "k2-s10-05", "text": "وقتی مخاطب دو بار تأیید کرد، توی ناخودآگاهش یه مسیر ساخته می‌شه: مسیر موافقت.", "t": [0.0236, 0.0769, 0.1404, 0.1732, 0.2162, 0.2797, 0.3435, 0.3848, 0.4947, 0.5262, 0.5772, 0.6381, 0.7432, 0.8306, 0.9517]}, {"id": "k2-s10-06", "text": "یه مثال ترکیبی توی حوزه‌ی پوست: «صورت اولین تأثیرگذاریه، درسته؟» بعد: «هیچ‌کس دوست نداره پیرتر از سنش دیده بشه، نه؟»", "t": [0.0158, 0.0382, 0.0746, 0.1249, 0.1543, 0.1977, 0.2726, 0.318, 0.3722, 0.4923, 0.5931, 0.6696, 0.7119, 0.7474, 0.7897, 0.832, 0.8538, 0.8825, 0.918, 0.9466, 0.9685]}, {"id": "k2-s10-07", "text": "توی حوزه‌ی سلامت: «کیفیت خواب مهمه، درسته؟» بعد: «انرژی پایین کل روز رو خراب می‌کنه، نه؟»", "t": [0.0171, 0.0546, 0.1099, 0.2097, 0.2804, 0.3397, 0.3989, 0.5211, 0.6054, 0.6606, 0.7159, 0.7444, 0.7818, 0.8103, 0.8566, 0.9267, 0.9641]}, {"id": "k2-s10-08", "text": "توی حوزه‌ی درآمد: «دو تا درآمد بهتر از یه درآمده، قبول داری؟» بعد: «این روزا درآمد ثابت دیگه امنیت کامل نمی‌ده، درسته؟»", "t": [0.0121, 0.0425, 0.0875, 0.1654, 0.1884, 0.2115, 0.2562, 0.2936, 0.3167, 0.3397, 0.4042, 0.4366, 0.506, 0.575, 0.6068, 0.6461, 0.693, 0.7323, 0.7717, 0.8186, 0.8579, 0.9172, 0.9719]}, {"id": "k2-s10-09", "text": "توی حوزه‌ی عطر: «بو خیلی توی ذهن آدم‌ها می‌مونه، درسته؟» بعد: «یه رایحه‌ی خوب واقعا اعتمادبه‌نفس می‌ده، نه؟»", "t": [0.013, 0.0464, 0.0957, 0.1658, 0.1913, 0.2328, 0.2664, 0.2999, 0.3494, 0.4192, 0.5257, 0.5621, 0.5923, 0.6602, 0.6998, 0.7582, 0.8733, 0.9338, 0.9672]}, {"id": "k2-s10-10", "text": "بعد از این دو تا تکون سر، حالا برو سراغ ادامه‌ی گفت‌وگو.", "t": [0.0335, 0.0981, 0.1473, 0.2118, 0.261, 0.3102, 0.3902, 0.4788, 0.5655, 0.6355, 0.7222, 0.8422, 0.9623]}]}, {"id": "k2-s11", "ch": 2, "title": "تکنیک چهارم: لبخند", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s11-01", "text": "لبخند یه حسه، نه یه تزئین. نبودن لبخند نابودکننده‌ست.", "t": [0.0, 0.1087, 0.1647, 0.2895, 0.331, 0.3724, 0.5443, 0.6457, 0.7471, 0.963]}, {"id": "k2-s11-02", "text": "لبخند یعنی امنیت، و امنیت یعنی اعتماد آنی.", "t": [0.0502, 0.1632, 0.258, 0.3933, 0.442, 0.5794, 0.6946, 0.8542, 0.9472]}, {"id": "k2-s11-03", "text": "ولی اینجا یه نکته‌ی دقیق‌تر هست: لبخند باید طبیعی باشه. لبخند زورکی، حس نقشه می‌ده.", "t": [0.0326, 0.0727, 0.1319, 0.1625, 0.2217, 0.2905, 0.386, 0.4471, 0.4982, 0.5593, 0.6694, 0.7419, 0.8144, 0.8518, 0.9125, 0.9733]}, {"id": "k2-s11-04", "text": "حتی پشت تلفن هم، لبخند توی صدات معلومه.", "t": [0.06, 0.1625, 0.265, 0.3918, 0.5067, 0.6244, 0.7042, 0.8029, 0.9396]}, {"id": "k2-s11-05", "text": "لبخند این پیام‌ها رو منتقل می‌کنه: من عجله ندارم؛ من امنم؛ من فشار نمیارم؛ من نیت انسانی دارم.", "t": [0.0259, 0.0734, 0.1056, 0.1609, 0.1854, 0.233, 0.3358, 0.36, 0.3995, 0.4916, 0.5229, 0.6205, 0.6455, 0.6862, 0.7837, 0.814, 0.8538, 0.922, 0.9713]}, {"id": "k2-s11-06", "text": "لبخند واقعی یعنی صورت باز، نگاه نرم، و لحن گرم. لبخند زورکی حس نقشه می‌ده.", "t": [0.032, 0.103, 0.1739, 0.2334, 0.2929, 0.3679, 0.4373, 0.521, 0.5465, 0.5951, 0.7061, 0.7723, 0.8384, 0.8725, 0.9279, 0.9834]}]}, {"id": "k2-s12", "ch": 2, "title": "تکنیک‌های تقویتی پنج تا هشت", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s12-01", "text": "تکنیک پنجم، «اکثر مردم...» ـه.", "t": [0.0, 0.156, 0.4079, 0.5882, 0.8593, 0.9116]}, {"id": "k2-s12-02", "text": "وقتی فکت رو با «اکثر مردم» شروع می‌کنی، تأیید گرفتن راحت‌تر می‌شه، چون ذهن آدم وقتی دودله، به انتخاب جمع نگاه می‌کنه.", "t": [0.0308, 0.0886, 0.1353, 0.1709, 0.2065, 0.2643, 0.3334, 0.3351, 0.353, 0.3961, 0.4393, 0.4893, 0.5645, 0.5991, 0.6338, 0.6684, 0.7113, 0.7624, 0.7888, 0.8481, 0.8828, 0.9257, 0.9768]}, {"id": "k2-s12-03", "text": "چند تا نمونه: اکثر مردم دوست دارن دو تا درآمد داشته باشن. اکثر مردم این روزا دنبال کار منعطفن.", "t": [0.0275, 0.0518, 0.0702, 0.1836, 0.2227, 0.2618, 0.3009, 0.34, 0.3641, 0.3882, 0.4348, 0.4814, 0.5863, 0.6394, 0.6924, 0.7352, 0.7882, 0.8514, 0.8942, 0.9676]}, {"id": "k2-s12-04", "text": "اکثر مردم به ظاهرشون اهمیت می‌دن. اکثر مردم دنبال راهی‌ان که زمان آزاد بیشتری داشته باشن.", "t": [0.0324, 0.0829, 0.1334, 0.1644, 0.244, 0.3042, 0.424, 0.4743, 0.5245, 0.5844, 0.654, 0.6849, 0.7351, 0.7854, 0.8549, 0.9148, 0.9651]}, {"id": "k2-s12-05", "text": "اکثر مردم دوست دارن از چیزی استفاده کنن که نتیجه‌ش معلوم باشه.", "t": [0.0545, 0.1264, 0.1984, 0.2704, 0.3424, 0.3866, 0.4586, 0.5721, 0.6302, 0.6745, 0.7742, 0.86, 0.932]}, {"id": "k2-s12-06", "text": "تکنیک ششم، «همه می‌دونن...» ـه. این عبارت فکت رو عمومی‌تر می‌کنه، و ذهن مخاطب می‌گه: «این حرف عجیب نیست...»", "t": [0.0282, 0.0851, 0.1513, 0.182, 0.2743, 0.334, 0.3635, 0.4071, 0.4365, 0.459, 0.5166, 0.5862, 0.6007, 0.6285, 0.6694, 0.7338, 0.7878, 0.8419, 0.9088, 0.9756]}, {"id": "k2-s12-07", "text": "نمونه‌هاش: همه می‌دونن این روزا داشتن یه کار انعطاف‌پذیر چقدر مهمه. همه می‌دونن پیشگیری بهتر از درمانه.", "t": [0.0331, 0.1085, 0.1429, 0.2019, 0.2363, 0.279, 0.3298, 0.356, 0.3904, 0.4822, 0.5248, 0.6315, 0.6714, 0.74, 0.818, 0.8675, 0.898, 0.9665]}, {"id": "k2-s12-08", "text": "همه می‌دونن پول بیشتر، آزادی بیشتری میاره. همه می‌دونن پوست سالم اعتمادبه‌نفس میاره.", "t": [0.0327, 0.0777, 0.1548, 0.1998, 0.2795, 0.3423, 0.4151, 0.5448, 0.5887, 0.6639, 0.7182, 0.7725, 0.8999, 0.9647]}, {"id": "k2-s12-09", "text": "همه می‌دونن آدم باید یه راهی برای رشد خودش داشته باشه.", "t": [0.0585, 0.124, 0.2361, 0.3015, 0.3824, 0.4323, 0.5133, 0.5942, 0.6596, 0.7406, 0.8372, 0.9181]}, {"id": "k2-s12-10", "text": "تکنیک هفتم، «همه می‌گن...» ـه. این هم مثل قبلی حس اجتماعی می‌ده؛ یعنی «فقط من نیستم که این رو می‌گم.»", "t": [0.0369, 0.0971, 0.1863, 0.2329, 0.3313, 0.3976, 0.4315, 0.4573, 0.4912, 0.5332, 0.559, 0.6252, 0.6988, 0.7395, 0.7724, 0.7974, 0.846, 0.871, 0.9039, 0.929, 0.9697]}, {"id": "k2-s12-11", "text": "نمونه‌هاش: همه می‌گن یه کاری داشته باش که به مکان خاص وابسته نباشه. همه می‌گن باید از جوونی مراقبت پوست رو شروع کرد.", "t": [0.0281, 0.1591, 0.1888, 0.2255, 0.2481, 0.2848, 0.3285, 0.3582, 0.3808, 0.4034, 0.4401, 0.4697, 0.5206, 0.6184, 0.6491, 0.6871, 0.7252, 0.7486, 0.794, 0.8466, 0.8847, 0.9081, 0.9461, 0.9769]}, {"id": "k2-s12-12", "text": "همه می‌گن درآمد دوم امنیت میاره. همه می‌گن وقت آزاد مهم‌تر از حقوق ثابته.", "t": [0.0297, 0.0806, 0.1436, 0.2187, 0.2696, 0.3448, 0.487, 0.5375, 0.6001, 0.6507, 0.7133, 0.7879, 0.8264, 0.889, 0.9636]}, {"id": "k2-s12-13", "text": "همه می‌گن آدم باید یه کاری کنه که آینده‌ش دست خودش باشه.", "t": [0.0536, 0.1184, 0.1987, 0.2635, 0.3438, 0.3931, 0.4734, 0.5382, 0.5876, 0.6987, 0.7636, 0.8438, 0.9241]}, {"id": "k2-s12-14", "text": "تکنیک هشتم، «خودت خوب می‌دونی که...» ـه. یعنی قبل از فکت، بهش اعتبار بده.", "t": [0.0472, 0.1282, 0.2513, 0.3069, 0.3518, 0.4288, 0.5098, 0.599, 0.6094, 0.6177, 0.6241, 0.6459, 0.7327, 0.8815, 0.9683]}, {"id": "k2-s12-15", "text": "چون داری به مخاطب این پیام رو می‌دی: «تو آگاهی داری... تو فهم داری... من دارم بهت احترام می‌ذارم.» و وقتی احترام هست، مقاومت کمتر می‌شه.", "t": [0.0203, 0.0433, 0.0718, 0.0894, 0.1234, 0.1464, 0.1749, 0.1924, 0.2604, 0.2806, 0.3197, 0.3836, 0.4055, 0.4343, 0.4998, 0.518, 0.5475, 0.5713, 0.6122, 0.6942, 0.7093, 0.7448, 0.794, 0.8361, 0.893, 0.9341, 0.9752]}, {"id": "k2-s12-16", "text": "نمونه‌هاش: خودت خوب می‌دونی الان داشتن یه کسب‌وکار مستقل چقدر لازمه. خودت خوب می‌دونی سلامت شوخی‌بردار نیست.", "t": [0.0276, 0.1589, 0.2012, 0.2353, 0.2938, 0.3361, 0.3865, 0.4125, 0.4791, 0.5295, 0.5718, 0.6727, 0.7137, 0.7469, 0.8038, 0.8527, 0.9333, 0.9743]}, {"id": "k2-s12-17", "text": "خودت خوب می‌دونی آدم باید روی پای خودش وایسه. خودت خوب می‌دونی ظاهر مرتب چقدر اثر داره.", "t": [0.033, 0.0814, 0.1204, 0.1874, 0.2264, 0.2748, 0.3138, 0.3529, 0.4012, 0.5197, 0.5755, 0.6205, 0.6978, 0.7535, 0.8093, 0.8651, 0.9101, 0.9659]}, {"id": "k2-s12-18", "text": "خودت خوب می‌دونی این روزا فقط با یه حقوق، همیشه راحت نبود.", "t": [0.0526, 0.1279, 0.1887, 0.293, 0.3538, 0.4291, 0.4899, 0.5362, 0.5826, 0.6927, 0.7954, 0.8816, 0.9679]}]}, {"id": "k2-s13", "ch": 2, "title": "تکنیک‌های تقویتی نُه و ده", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s13-01", "text": "تکنیک نهم، «از قدیم گفتن...» ـه. این تکنیک حس آشنایی و اعتماد فرهنگی می‌ده، چون ذهن مخاطب با چیزهای قدیمی احساس امنیت می‌کنه.", "t": [0.0, 0.0523, 0.1158, 0.1363, 0.1695, 0.2476, 0.3052, 0.3344, 0.3775, 0.3997, 0.4498, 0.4651, 0.5151, 0.5652, 0.6186, 0.6488, 0.679, 0.7235, 0.7465, 0.7982, 0.8428, 0.8873, 0.9319, 0.9764]}, {"id": "k2-s13-02", "text": "نمونه‌هاش: از قدیم گفتن پیشگیری بهتر از درمانه.", "t": [0.0511, 0.3012, 0.3557, 0.4442, 0.5327, 0.6723, 0.7608, 0.8153, 0.9379]}, {"id": "k2-s13-03", "text": "یه ضرب‌المثل قدیمی هست که می‌گه: هرکه بامش بیش، برفش بیشتر.", "t": [0.0433, 0.0831, 0.1975, 0.2745, 0.3267, 0.3665, 0.4706, 0.5642, 0.6578, 0.759, 0.8469, 0.9517]}, {"id": "k2-s13-04", "text": "از قدیم گفتن آدم باید به خودش برسه.", "t": [0.0543, 0.1305, 0.2545, 0.3784, 0.4785, 0.6024, 0.6786, 0.8026, 0.9265]}, {"id": "k2-s13-05", "text": "یه ضرب‌المثل قدیمی هست که می‌گه: تا حرکت نکنی، راه باز نمی‌شه.", "t": [0.0377, 0.078, 0.1937, 0.2717, 0.3245, 0.3647, 0.4768, 0.5304, 0.6176, 0.7047, 0.7751, 0.8454, 0.9493]}, {"id": "k2-s13-06", "text": "از قدیم گفتن کار امروز رو نذار برای فردا.", "t": [0.0614, 0.1253, 0.2291, 0.3329, 0.4168, 0.5406, 0.6045, 0.7083, 0.8121, 0.916]}, {"id": "k2-s13-07", "text": "و تکنیک دهم: «دوست داری اول چی رو بدونی؟»", "t": [0.0753, 0.132, 0.2918, 0.5073, 0.588, 0.6687, 0.7339, 0.7836, 0.8333, 0.9295]}, {"id": "k2-s13-08", "text": "این تکنیک مخصوص موقعیت‌هاییه که طرف می‌دونه تو نتورک کار می‌کنی.", "t": [0.0441, 0.1038, 0.1919, 0.28, 0.4533, 0.4987, 0.5584, 0.6607, 0.7062, 0.7942, 0.8539, 0.942]}, {"id": "k2-s13-09", "text": "این سؤال یه پیام خیلی قوی داره: «من برنامه‌ی پنهانی ندارم؛ اختیار با توئه.»", "t": [0.037, 0.0867, 0.1482, 0.186, 0.2474, 0.3089, 0.3585, 0.486, 0.5221, 0.6144, 0.6955, 0.8035, 0.8759, 0.9081, 0.9604]}, {"id": "k2-s13-10", "text": "با این سؤال، اختیار می‌دی، برنامه‌ی از پیش تعیین‌شده رو می‌شکنی، حس امنیت می‌سازی، و فیلتر تجربه‌ی بد گذشته خاموش می‌شه.", "t": [0.0216, 0.0645, 0.121, 0.217, 0.2566, 0.2852, 0.3302, 0.3478, 0.3709, 0.4215, 0.439, 0.5001, 0.531, 0.5909, 0.6814, 0.6991, 0.7491, 0.8071, 0.8329, 0.8829, 0.9329, 0.9748]}, {"id": "k2-s13-11", "text": "چند تا نمونه: دوست داری اول چی رو بدونی؟ اول کدوم بخشش برات مهم‌تره؟", "t": [0.0362, 0.0765, 0.1072, 0.2428, 0.2967, 0.3505, 0.394, 0.4271, 0.4603, 0.5932, 0.6495, 0.7192, 0.789, 0.8587, 0.9552]}, {"id": "k2-s13-12", "text": "می‌خوای اول درباره‌ی درآمدش صحبت کنیم یا زمانش؟ اول سؤالت درباره‌ی چیه؟", "t": [0.0336, 0.1283, 0.1836, 0.2915, 0.3863, 0.4547, 0.5231, 0.5652, 0.7025, 0.7497, 0.8194, 0.9115, 0.9587]}, {"id": "k2-s13-13", "text": "تو دوست داری اول از زاویه‌ی محصول ببینی یا از زاویه‌ی کار؟", "t": [0.0428, 0.0935, 0.1758, 0.2582, 0.3247, 0.3754, 0.4895, 0.5877, 0.6859, 0.7365, 0.7872, 0.9013, 0.9678]}]}, {"id": "k2-s14", "ch": 2, "title": "تکنیک یازدهم: تعریف صادقانه", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s14-01", "text": "تعریف باید واقعی باشه، نه چاپلوسی. تعریف صادقانه یعنی اهمیت دادن.", "t": [0.0, 0.0729, 0.1341, 0.207, 0.3058, 0.3423, 0.5198, 0.6061, 0.7202, 0.7925, 0.8788, 0.9512]}, {"id": "k2-s14-02", "text": "ولی نکته‌ی مهم اینه که تعریف باید ریز و واقعی باشه.", "t": [0.0701, 0.1398, 0.2427, 0.3124, 0.3987, 0.4518, 0.5547, 0.641, 0.7107, 0.7472, 0.8501, 0.9364]}, {"id": "k2-s14-03", "text": "تعریف کلی مثل «تو خیلی خوبی» اثر نداره. تعریف دقیق مثل «چقدر مرتب حرف می‌زنی» اثر داره.", "t": [0.0275, 0.095, 0.1406, 0.1863, 0.2211, 0.2777, 0.3342, 0.3799, 0.4938, 0.5588, 0.6133, 0.6573, 0.7117, 0.7662, 0.8102, 0.8751, 0.9191, 0.9736]}, {"id": "k2-s14-04", "text": "چند تا نمونه‌ی تعریف صادقانه و دقیق: چه لبخند زیبایی داری.", "t": [0.0448, 0.1039, 0.1489, 0.2501, 0.3373, 0.4526, 0.4835, 0.6502, 0.6957, 0.7839, 0.8863, 0.9603]}, {"id": "k2-s14-05", "text": "لباست خیلی شیک و مرتب ست شده؛ خودت ست می‌کنی؟", "t": [0.0516, 0.1697, 0.2689, 0.3489, 0.3909, 0.49, 0.551, 0.6992, 0.7921, 0.8493, 0.9602]}, {"id": "k2-s14-06", "text": "خیلی خوش‌برخوردی، این ویژگی قشنگیه.", "t": [0.0447, 0.1819, 0.5336, 0.6311, 0.7749, 0.9419]}, {"id": "k2-s14-07", "text": "خیلی منظم حرف می‌زنی؛ معلومه اهل برنامه‌ای.", "t": [0.0526, 0.164, 0.2754, 0.3654, 0.5527, 0.6918, 0.7729, 0.9507]}, {"id": "k2-s14-08", "text": "اعتمادبه‌نفست توی صحبت کردن کاملا معلومه.", "t": [0.0505, 0.3373, 0.4286, 0.5415, 0.6545, 0.7892, 0.9456]}, {"id": "k2-s14-09", "text": "چقدر دقیق گوش می‌دی؛ این خیلی ارزشمنده.", "t": [0.0536, 0.1646, 0.2757, 0.3654, 0.5449, 0.6334, 0.7429, 0.9367]}, {"id": "k2-s14-10", "text": "و یه خط قرمز: شروع گفت‌وگو با انتقاد، یعنی نابودی حسن تفاهم.", "t": [0.0383, 0.0691, 0.1139, 0.1587, 0.2922, 0.3616, 0.4577, 0.5004, 0.6245, 0.7009, 0.8067, 0.8684, 0.9595]}, {"id": "k2-s14-11", "text": "این مثال‌های غلط رو کاملا کنار بذار: «نمی‌خوای یه فکری به حال هیکلت بکنی؟» «چرا این‌قدر بی‌توجهی؟» «چرا تا حالا یه کار درست‌وحسابی نکردی؟»", "t": [0.0222, 0.0511, 0.1076, 0.1365, 0.1585, 0.2012, 0.237, 0.3224, 0.3714, 0.3906, 0.4217, 0.4408, 0.466, 0.5031, 0.5725, 0.6042, 0.6585, 0.7661, 0.7907, 0.8095, 0.8401, 0.8589, 0.8836, 0.9494, 0.9858]}]}, {"id": "k2-s15", "ch": 2, "title": "تکنیک دوازدهم: کاری کن مخاطب درباره‌ی خودش حرف بزنه", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s15-01", "text": "مردم بیشترین علاقه رو به حرف زدن درباره‌ی خودشون دارن.", "t": [0.0, 0.0868, 0.2237, 0.3271, 0.3806, 0.434, 0.5041, 0.5742, 0.711, 0.8312, 0.918]}, {"id": "k2-s15-02", "text": "وقتی مخاطب درباره‌ی خودش حرف می‌زنه، ناخودآگاهش می‌گه: «اینجا امنه.»", "t": [0.0503, 0.1117, 0.185, 0.2818, 0.3432, 0.3928, 0.5303, 0.6602, 0.7957, 0.8793, 0.9495]}, {"id": "k2-s15-03", "text": "هرچی مخاطب زودتر شروع کنه درباره‌ی خودش حرف بزنه، حسن تفاهم سریع‌تر ساخته می‌شه.", "t": [0.0397, 0.099, 0.1696, 0.2402, 0.2995, 0.3473, 0.4408, 0.5, 0.5478, 0.6231, 0.6724, 0.7451, 0.8296, 0.9024, 0.9634]}, {"id": "k2-s15-04", "text": "تعریف صادقانه به‌علاوه‌ی سؤال، یه ترکیب طلاییه.", "t": [0.0454, 0.1677, 0.3295, 0.511, 0.6136, 0.6767, 0.799, 0.9411]}, {"id": "k2-s15-05", "text": "چند تا سؤال نمونه: تو لباست رو خودت انتخاب می‌کنی یا کسی کمکت می‌کنه؟ تو همیشه این‌قدر منظم بودی؟", "t": [0.0294, 0.0571, 0.0783, 0.1127, 0.2203, 0.249, 0.3047, 0.3334, 0.3801, 0.4448, 0.5005, 0.5292, 0.567, 0.6137, 0.7236, 0.7537, 0.8119, 0.8794, 0.9282, 0.977]}, {"id": "k2-s15-06", "text": "تو بیشتر از چی توی کار خوشت میاد؟ تو بیشتر اهل کار تیمی هستی یا مستقل کار کردن؟", "t": [0.0252, 0.0561, 0.1161, 0.1471, 0.178, 0.2187, 0.2593, 0.3096, 0.4082, 0.4462, 0.5198, 0.5697, 0.6196, 0.6813, 0.7431, 0.7811, 0.8547, 0.9046, 0.9663]}, {"id": "k2-s15-07", "text": "تو دنبال درآمدی یا دنبال آزادی زمان؟ تو قبلا تجربه‌ی فروش داشتی؟ چطور بوده برات؟", "t": [0.0272, 0.0647, 0.1374, 0.2219, 0.2594, 0.3321, 0.4048, 0.5195, 0.5551, 0.613, 0.6931, 0.751, 0.852, 0.8936, 0.9352, 0.9768]}, {"id": "k2-s15-08", "text": "تو معمولا تصمیم‌هات رو سریع می‌گیری یا با فکر؟ تو بیشتر دنبال نتیجه‌ی کوتاه‌مدتی یا بلندمدت؟", "t": [0.0185, 0.0474, 0.1125, 0.1957, 0.2246, 0.2716, 0.3367, 0.3656, 0.3945, 0.4735, 0.5101, 0.5811, 0.6521, 0.7345, 0.8513, 0.8879, 0.9818]}]}, {"id": "k2-s16", "ch": 2, "title": "تکنیک سیزدهم: کلمه‌ی ممنوعه‌ی «چرا»", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s16-01", "text": "«چرا» آدم‌ها رو دفاعی می‌کنه، چون توی ذهن خیلی‌ها یادآور سرزنش، ملامت و بازخواسته.", "t": [0.0, 0.042, 0.104, 0.136, 0.198, 0.3115, 0.3641, 0.4166, 0.4691, 0.5592, 0.6492, 0.7469, 0.8163, 0.8409, 0.9549]}, {"id": "k2-s16-02", "text": "پس تا جایی که می‌شه، «چرا» نگو.", "t": [0.0672, 0.1407, 0.2142, 0.3337, 0.4072, 0.6036, 0.7543, 0.905]}, {"id": "k2-s16-03", "text": "«چرا» اول سؤال، مخاطب رو فوری می‌بره توی حالت دفاعی و دیوار مقاومت رو بالا می‌کشه، چون توی ذهنش با سرزنش و بازجویی گره خورده.", "t": [0.0154, 0.0692, 0.1004, 0.139, 0.1851, 0.2089, 0.2475, 0.2935, 0.3247, 0.3633, 0.4094, 0.4257, 0.4718, 0.5252, 0.549, 0.5876, 0.6696, 0.6984, 0.7272, 0.7628, 0.7847, 0.8272, 0.8423, 0.8985, 0.9273, 0.9698]}, {"id": "k2-s16-04", "text": "خب، جایگزین حرفه‌ای «چرا» چیه؟", "t": [0.0591, 0.1596, 0.417, 0.6431, 0.7749, 0.9068]}, {"id": "k2-s16-05", "text": "به‌جای «چرا» بگو: «می‌تونی کمکم کنی متوجه بشم...؟»", "t": [0.0422, 0.2453, 0.4561, 0.5191, 0.6272, 0.7052, 0.7683, 0.8613, 0.9244]}, {"id": "k2-s16-06", "text": "این مدل یه پیام زیرپوستی داره: «من نمی‌خوام گیرت بندازم... می‌خوام بفهمم.»", "t": [0.0339, 0.0808, 0.1277, 0.1635, 0.2215, 0.3243, 0.4671, 0.4993, 0.5819, 0.6342, 0.784, 0.8705, 0.945]}, {"id": "k2-s16-07", "text": "هم دفاعیش نمی‌کنه، هم مخاطب رو می‌بره توی حرف زدن درباره‌ی خودش.", "t": [0.0443, 0.0962, 0.2129, 0.3531, 0.3951, 0.4766, 0.5187, 0.6001, 0.6553, 0.7105, 0.7657, 0.8735, 0.9418]}, {"id": "k2-s16-08", "text": "چند تا نمونه‌ی جایگزین حرفه‌ای: می‌تونی کمکم کنی متوجه بشم وقتی می‌گی نمی‌خوام، دقیقا منظورت چیه؟", "t": [0.0198, 0.0498, 0.0726, 0.124, 0.1826, 0.2987, 0.374, 0.4283, 0.4723, 0.5371, 0.581, 0.6354, 0.6898, 0.7958, 0.8528, 0.9189, 0.9575]}, {"id": "k2-s16-09", "text": "می‌تونی کمکم کنی بفهمم این تصمیم رو بر چه اساسی گرفتی؟", "t": [0.0516, 0.1656, 0.2479, 0.3144, 0.4126, 0.4791, 0.5772, 0.6279, 0.6785, 0.7292, 0.8273, 0.9255]}, {"id": "k2-s16-10", "text": "می‌تونی کمکم کنی بفهمم چی باعث شد این انتخاب رو بکنی؟", "t": [0.0489, 0.1656, 0.2498, 0.3179, 0.4184, 0.4702, 0.5545, 0.6064, 0.6744, 0.7911, 0.843, 0.9272]}, {"id": "k2-s16-11", "text": "می‌تونی کمکم کنی بفهمم چی برات توی این موضوع مهم‌تره؟", "t": [0.0474, 0.1719, 0.2618, 0.3344, 0.4417, 0.497, 0.5869, 0.6595, 0.7321, 0.8393, 0.9638]}]}, {"id": "k2-s17", "ch": 2, "title": "تکنیک سیزده به‌علاوه‌ی یک: ذهن‌خوانی", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s17-01", "text": "ذهن‌خوانی یعنی چیزی رو که مطمئنی توی ذهن مخاطب می‌گذره، بلند بگی.", "t": [0.0, 0.1228, 0.1923, 0.2617, 0.3044, 0.3471, 0.4433, 0.4993, 0.5554, 0.6382, 0.7968, 0.8746, 0.9375]}, {"id": "k2-s17-02", "text": "چرا این تکنیک اثر داره؟ چون مخاطب حس می‌کنه: «این آدم منو می‌فهمه... انگار ذهنمو خوند.»", "t": [0.0303, 0.0668, 0.1034, 0.1574, 0.1939, 0.277, 0.3196, 0.3824, 0.4148, 0.5255, 0.5652, 0.6048, 0.6445, 0.7643, 0.8322, 0.9002, 0.9572]}, {"id": "k2-s17-03", "text": "قالب جمله‌ش اینه: «لابد داری به این فکر می‌کنی که...»", "t": [0.0426, 0.1257, 0.2247, 0.4107, 0.4979, 0.585, 0.6387, 0.7091, 0.7795, 0.8834, 0.937]}, {"id": "k2-s17-04", "text": "چند تا نمونه: لابد داری به این فکر می‌کنی واسه چی بهت زنگ زدم.", "t": [0.0291, 0.075, 0.1099, 0.2914, 0.3591, 0.4268, 0.4685, 0.5232, 0.5779, 0.6586, 0.7264, 0.7681, 0.8228, 0.8775, 0.9322]}, {"id": "k2-s17-05", "text": "لابد داری به این فکر می‌کنی وقتش رو داری یا نه.", "t": [0.0477, 0.1412, 0.2347, 0.2922, 0.3677, 0.4432, 0.5547, 0.6482, 0.7057, 0.7992, 0.8567, 0.9143]}, {"id": "k2-s17-06", "text": "لابد داری به این فکر می‌کنی آخرش قراره چی بشه.", "t": [0.0408, 0.138, 0.2352, 0.295, 0.3735, 0.452, 0.5679, 0.6651, 0.781, 0.8408, 0.9193]}, {"id": "k2-s17-07", "text": "لابد داری به این فکر می‌کنی این هم مثل بقیه‌ی کاراست یا فرق داره.", "t": [0.0314, 0.1033, 0.1752, 0.2195, 0.2776, 0.3357, 0.4214, 0.4795, 0.5238, 0.5818, 0.6676, 0.7672, 0.8114, 0.8695, 0.9414]}, {"id": "k2-s17-08", "text": "لابد داری به این فکر می‌کنی این حرفا واقعیه یا نه.", "t": [0.0391, 0.1289, 0.2186, 0.2739, 0.3464, 0.4189, 0.5259, 0.5984, 0.6882, 0.8124, 0.8677, 0.9229]}, {"id": "k2-s17-09", "text": "لابد داری به این فکر می‌کنی این کار چطوری انجام می‌شه.", "t": [0.0389, 0.1226, 0.2063, 0.2578, 0.3255, 0.3931, 0.4929, 0.5605, 0.6282, 0.728, 0.8278, 0.9115]}, {"id": "k2-s17-10", "text": "این تکنیک حس نزدیکی و فهمیده شدن می‌سازه، و سرعت اعتماد رو بالا می‌بره.", "t": [0.0266, 0.0827, 0.1654, 0.2081, 0.3042, 0.3336, 0.4297, 0.4857, 0.6038, 0.6319, 0.6982, 0.79, 0.8308, 0.8971, 0.9761]}]}, {"id": "k2-s18", "ch": 2, "title": "مرور کامل چهارده تکنیک حسن تفاهم", "eyebrow": "فصل دوم · عبور از فیلترهای ناخودآگاه", "lines": [{"id": "k2-s18-01", "text": "بیا همه‌ی چهار ستون و چهارده تکنیک رو یه‌جا مرور کنیم.", "t": [0.0, 0.0729, 0.1631, 0.2532, 0.3434, 0.3816, 0.5065, 0.614, 0.6696, 0.7597, 0.8499, 0.9401]}, {"id": "k2-s18-02", "text": "توی این بخش، چهار ستون اصلی حسن تفاهم و چهارده تکنیک عملی رو برای ساختن اعتماد آنی و ارتباط مؤثر با مخاطب دیدیم.", "t": [0.0252, 0.0528, 0.0805, 0.129, 0.172, 0.2149, 0.2578, 0.2925, 0.3437, 0.3619, 0.4213, 0.4725, 0.5154, 0.5418, 0.5848, 0.636, 0.6954, 0.7301, 0.7482, 0.8077, 0.8506, 0.877, 0.9282, 0.9794]}, {"id": "k2-s18-03", "text": "اگه این تکنیک‌ها رو قبل از هر جلسه‌ی گفت‌وگو مرور کنی، کیفیت ارتباط‌هات به‌شکل قابل توجهی بهتر می‌شه.", "t": [0.0302, 0.0645, 0.0988, 0.1657, 0.1919, 0.2262, 0.2523, 0.2785, 0.3291, 0.3879, 0.4304, 0.4962, 0.5624, 0.6713, 0.7375, 0.793, 0.8592, 0.9148, 0.9703]}, {"id": "k2-s18-04", "text": "بیان یه واقعیت یا فکت: قفل ذهن رو با یه حقیقت قابل قبول باز کن.", "t": [0.0411, 0.1198, 0.1681, 0.277, 0.3254, 0.4483, 0.4998, 0.5514, 0.5906, 0.6299, 0.6692, 0.7452, 0.809, 0.8729, 0.9244, 0.9637]}, {"id": "k2-s18-05", "text": "همراهی کردن: با مخاطب هم‌حال شو و پیام همدلی بفرست.", "t": [0.0507, 0.1589, 0.3156, 0.3696, 0.4742, 0.5787, 0.6327, 0.6698, 0.7575, 0.8621, 0.9666]}, {"id": "k2-s18-06", "text": "بیان دومین واقعیت: مسیر موافقت رو توی ناخودآگاه مخاطب قوی‌تر کن.", "t": [0.0304, 0.1029, 0.1894, 0.3062, 0.3811, 0.4848, 0.5309, 0.5915, 0.7384, 0.8278, 0.9171, 0.9632]}, {"id": "k2-s18-07", "text": "لبخند طبیعی: حس امنیت و اعتماد آنی رو با لبخند واقعی بساز.", "t": [0.0411, 0.1286, 0.2789, 0.3258, 0.4167, 0.4489, 0.5544, 0.616, 0.6629, 0.7098, 0.8006, 0.8915, 0.9677]}, {"id": "k2-s18-08", "text": "«اکثر مردم»، «همه می‌دونن»، «همه می‌گن»: از اعتبار اجتماعی برای کم کردن مقاومت استفاده کن.", "t": [0.0275, 0.0987, 0.1984, 0.2374, 0.3367, 0.3805, 0.4792, 0.5104, 0.5804, 0.6602, 0.7108, 0.7419, 0.7925, 0.8625, 0.9423, 0.9735]}, {"id": "k2-s18-09", "text": "«خودت خوب می‌دونی» یا «از قدیم گفتن»: با احترام و اعتماد فرهنگی، حس آشنایی بساز.", "t": [0.0332, 0.0796, 0.1171, 0.2129, 0.2546, 0.2962, 0.3639, 0.4787, 0.5126, 0.589, 0.6123, 0.6887, 0.7935, 0.8309, 0.915, 0.9757]}, {"id": "k2-s18-10", "text": "«دوست داری اول چی رو بدونی؟»: اختیار رو بده دست مخاطب و برنامه‌ی پنهانی رو بشکن.", "t": [0.0354, 0.0818, 0.1282, 0.1656, 0.1942, 0.2227, 0.3454, 0.4325, 0.4712, 0.5221, 0.5729, 0.648, 0.6746, 0.7739, 0.861, 0.8998, 0.9627]}, {"id": "k2-s18-11", "text": "تعریف صادقانه: تعریف ریز و دقیق، نه چاپلوسی کلی.", "t": [0.0497, 0.1524, 0.3567, 0.4607, 0.5312, 0.5681, 0.7011, 0.7543, 0.8904, 0.9601]}, {"id": "k2-s18-12", "text": "کاری کن مخاطب درباره‌ی خودش حرف بزنه: مردم بیشترین علاقه رو به حرف زدن درباره‌ی خودشون دارن.", "t": [0.0333, 0.0847, 0.1163, 0.1775, 0.2585, 0.3099, 0.3514, 0.4535, 0.5025, 0.5798, 0.6382, 0.6683, 0.6985, 0.7381, 0.7777, 0.855, 0.9228, 0.9718]}, {"id": "k2-s18-13", "text": "کلمه‌ی ممنوعه‌ی «چرا»: جایگزینش «می‌تونی کمکم کنی متوجه بشم...؟» ـه.", "t": [0.0368, 0.1261, 0.2441, 0.3648, 0.4988, 0.6036, 0.6794, 0.7405, 0.8308, 0.9378, 0.9665]}, {"id": "k2-s18-14", "text": "و ذهن‌خوانی: «لابد داری به این فکر می‌کنی که...»؛ یعنی حس فهمیده شدن.", "t": [0.0412, 0.0768, 0.2941, 0.3504, 0.4067, 0.4414, 0.4869, 0.5324, 0.5996, 0.6876, 0.7627, 0.8089, 0.9128, 0.9734]}]}, {"id": "k3-s01", "ch": 3, "title": "ورود به مهارت یخ‌شکن", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s01-01", "text": "حالا سؤال اینه: چطوری جذاب حرف بزنیم که طرف خودش بخواد ادامه بده؟", "t": [0.0, 0.0499, 0.0999, 0.2226, 0.3075, 0.3788, 0.4363, 0.5213, 0.5651, 0.6227, 0.6939, 0.7789, 0.8639, 0.9214]}, {"id": "k3-s01-02", "text": "این بخش، مهارت یخ‌شکن رو کامل، ساختاریافته و قابل تدریس بهت یاد می‌ده؛ از اصول بنیادی تا فرمول‌های عملی و مثال‌های کاربردی توی حوزه‌های مختلف.", "t": [0.0069, 0.0321, 0.0688, 0.1175, 0.1662, 0.1913, 0.243, 0.3223, 0.3366, 0.3704, 0.4108, 0.4381, 0.4654, 0.5333, 0.553, 0.5851, 0.6296, 0.6493, 0.7061, 0.7382, 0.7518, 0.8024, 0.853, 0.8789, 0.9296, 0.9678]}, {"id": "k3-s01-03", "text": "اینجا با مهارت‌های مکالمه‌ی حرفه‌ای، و ابزارهای فروش و نتورک روبه‌رو می‌شیم.", "t": [0.0, 0.0835, 0.1267, 0.2506, 0.3611, 0.4582, 0.4878, 0.6118, 0.6819, 0.7115, 0.7951, 0.8921, 0.9756]}]}, {"id": "k3-s02", "ch": 3, "title": "چرا یخ‌شکن اهمیت داره؟", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s02-01", "text": "توی پنج ماشه‌ی تصمیم‌گیری، بعد از حسن تفاهم و اعتماد آنی، دو تا سؤال مهم توی ذهن مخاطب فعال می‌شه.", "t": [0.0, 0.0424, 0.0848, 0.1474, 0.2504, 0.2929, 0.3252, 0.3676, 0.4302, 0.4524, 0.5251, 0.5776, 0.6073, 0.6369, 0.6852, 0.7241, 0.7631, 0.802, 0.8595, 0.9078, 0.956]}, {"id": "k3-s02-02", "text": "این دو تا سؤال، سرنوشت هر مکالمه رو تعیین می‌کنن، و درک درستشون پایه و اساس مهارت یخ‌شکنه.", "t": [0.036, 0.0753, 0.1053, 0.1352, 0.1839, 0.2514, 0.2813, 0.3488, 0.3787, 0.4368, 0.5058, 0.5305, 0.5777, 0.6698, 0.7282, 0.7529, 0.8113, 0.8809, 0.9618]}, {"id": "k3-s02-03", "text": "سؤال سوم اینه: «آیا چیزی که می‌گی جالبه؟» جواب این سؤال باید «بله» بشه. و این وظیفه‌ی ماست.", "t": [0.0269, 0.0738, 0.1117, 0.2216, 0.2619, 0.3119, 0.3426, 0.3926, 0.5048, 0.5567, 0.5986, 0.6505, 0.7024, 0.7889, 0.8154, 0.8329, 0.8665, 0.9239, 0.9654]}, {"id": "k3-s02-04", "text": "سؤال چهارم اینه: «آیا می‌خوامش یا نه؟» جواب این سؤال، انتخاب خود مخاطبه، نه وظیفه‌ی ما.", "t": [0.0215, 0.0677, 0.1228, 0.2327, 0.2751, 0.358, 0.3903, 0.4816, 0.5355, 0.5791, 0.633, 0.7077, 0.7513, 0.826, 0.8592, 0.9339, 0.9671]}, {"id": "k3-s02-05", "text": "پس وظیفه‌ی ما فروختن نیست. وظیفه‌ی ما جذاب گفتنه.", "t": [0.0318, 0.0862, 0.2086, 0.2631, 0.3855, 0.5281, 0.6626, 0.7224, 0.8196, 0.9355]}, {"id": "k3-s02-06", "text": "حالا یخ‌شکن یعنی چی؟", "t": [0.1032, 0.3057, 0.5472, 0.7497, 0.8744]}, {"id": "k3-s02-07", "text": "یعنی جمله‌ای بگی که هشدار فروشنده روشن نشه، کنجکاوی فعال بشه، اختیار دست مخاطب بمونه، و خودش بپرسه: «چطوری؟ چی هست؟»", "t": [0.0157, 0.0526, 0.1038, 0.1336, 0.1563, 0.2004, 0.2586, 0.2955, 0.3491, 0.4193, 0.4638, 0.528, 0.5848, 0.618, 0.6669, 0.7159, 0.7332, 0.7743, 0.8428, 0.924, 0.951, 0.9863]}]}, {"id": "k3-s03", "ch": 3, "title": "اصل بنیادین یخ‌شکن", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s03-01", "text": "برای اینکه یخ‌شکن رو عمیق‌تر بفهمی، اول باید ببینی آدم‌ها چطوری تصمیم می‌گیرن.", "t": [0.0, 0.0694, 0.1521, 0.2348, 0.2775, 0.3736, 0.472, 0.5188, 0.5767, 0.6457, 0.7148, 0.7838, 0.8529, 0.9331]}, {"id": "k3-s03-02", "text": "این اصل، پایه‌ی علمی و روان‌شناختی مهارت یخ‌شکنه، و بدون فهمیدنش هیچ فرمولی درست اجرا نمی‌شه.", "t": [0.0267, 0.0742, 0.1515, 0.2141, 0.2666, 0.2888, 0.402, 0.4646, 0.5503, 0.5711, 0.6204, 0.6981, 0.7379, 0.8062, 0.8555, 0.9047, 0.9635]}, {"id": "k3-s03-03", "text": "آدم‌ها با اطلاعات تصمیم می‌گیرن؟ نه.", "t": [0.0381, 0.1708, 0.2393, 0.4149, 0.5476, 0.8053, 0.9048]}, {"id": "k3-s03-04", "text": "دادن حجم زیادی اطلاعات، لزوما به یه تصمیم مثبت نمی‌رسه. آدم‌ها اطلاعات رو پردازش می‌کنن، ولی باهاش تصمیم نمی‌گیرن.", "t": [0.0146, 0.0592, 0.0953, 0.1486, 0.2191, 0.2724, 0.2999, 0.3273, 0.3806, 0.4253, 0.5315, 0.5783, 0.6402, 0.6643, 0.7187, 0.7915, 0.8212, 0.8649, 0.9086, 0.9664]}, {"id": "k3-s03-05", "text": "با منطق چی؟ با منطق هم تصمیم نمی‌گیرن.", "t": [0.0408, 0.1207, 0.2505, 0.4479, 0.5045, 0.5964, 0.653, 0.7626, 0.9075]}, {"id": "k3-s03-06", "text": "استدلال منطقی و آوردن دلیل و برهان هم به‌تنهایی کافی نیست. مخاطب ممکنه باهات موافق باشه، ولی عمل نکنه.", "t": [0.0162, 0.0903, 0.1463, 0.1661, 0.2221, 0.2691, 0.2889, 0.3449, 0.3738, 0.4569, 0.5038, 0.5907, 0.6352, 0.6798, 0.7244, 0.7689, 0.8331, 0.8726, 0.9121, 0.961]}, {"id": "k3-s03-07", "text": "پس چطوری تصمیم می‌گیرن؟ با ناخودآگاه.", "t": [0.0436, 0.1044, 0.2222, 0.3399, 0.593, 0.6669, 0.9024]}, {"id": "k3-s03-08", "text": "تصمیم‌گیری واقعی، توی لایه‌های عمیق‌تر ذهن اتفاق می‌افته، و یخ‌شکن دقیقا با همین لایه‌ها حرف می‌زنه.", "t": [0.0167, 0.1173, 0.1784, 0.2198, 0.3007, 0.3717, 0.4131, 0.4743, 0.5624, 0.5841, 0.6452, 0.7063, 0.7378, 0.789, 0.86, 0.9013, 0.9624]}, {"id": "k3-s03-09", "text": "پس مهم نیست چقدر بلدی؛ مهم اینه که چطوری شروع می‌کنی.", "t": [0.031, 0.0846, 0.1549, 0.242, 0.3291, 0.4834, 0.5454, 0.6222, 0.6695, 0.7611, 0.8379, 0.9295]}, {"id": "k3-s03-10", "text": "یخ‌شکن هنر شروع کردنه، نه هنر توضیح دادن.", "t": [0.032, 0.1801, 0.2804, 0.4047, 0.6157, 0.675, 0.7528, 0.8676, 0.9638]}]}, {"id": "k3-s04", "ch": 3, "title": "منفعل بودن ممنوع", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s04-01", "text": "یکی از رایج‌ترین اشتباه‌هایی که نتورکرها می‌کنن، انتظار کشیدنه.", "t": [0.0, 0.0634, 0.1117, 0.2507, 0.4198, 0.4681, 0.607, 0.73, 0.8351, 0.9402]}, {"id": "k3-s04-02", "text": "منفعل بودن توی این حرفه، یعنی متوقف موندن و چشم دوختن به اینکه بقیه پیش‌قدم بشن؛ و این مدل، رشد نمی‌سازه.", "t": [0.0374, 0.1119, 0.1744, 0.2248, 0.2753, 0.3487, 0.3818, 0.4213, 0.4607, 0.4747, 0.5015, 0.5409, 0.5613, 0.6007, 0.6338, 0.6796, 0.7523, 0.7685, 0.7994, 0.8579, 0.8964, 0.9717]}, {"id": "k3-s04-03", "text": "منفعل یعنی چی؟ یعنی محصول دستت باشه، بیزینس داشته باشی، ولی صبر کنی یکی بپرسه: «این چیه؟»", "t": [0.0366, 0.1007, 0.1545, 0.2448, 0.2892, 0.3421, 0.3865, 0.4611, 0.5216, 0.5737, 0.6292, 0.6684, 0.7077, 0.7469, 0.7861, 0.8839, 0.9285, 0.9731]}, {"id": "k3-s04-04", "text": "این مدل، رشد نمی‌سازه.", "t": [0.0962, 0.2508, 0.445, 0.5982, 0.8973]}, {"id": "k3-s04-05", "text": "حالا یه نتورکر بزرگ چی کار می‌کنه؟", "t": [0.0996, 0.2225, 0.2981, 0.4682, 0.5911, 0.6667, 0.766, 0.9125]}, {"id": "k3-s04-06", "text": "نتورکری که می‌خواد زندگی بسازه، باید بره سراغ آدم‌ها؛ باید ابتکار عمل رو دست بگیره.", "t": [0.0414, 0.1296, 0.164, 0.2415, 0.3082, 0.3749, 0.4309, 0.4761, 0.5321, 0.6251, 0.6834, 0.7641, 0.8111, 0.847, 0.894, 0.9635]}, {"id": "k3-s04-07", "text": "یخ‌شکن یعنی چیزی بگی که طرف مجبور بشه سؤال بپرسه، نه اینکه تو خواهش کنی گوش بده.", "t": [0.0436, 0.1183, 0.181, 0.2437, 0.2943, 0.3328, 0.3834, 0.4581, 0.5087, 0.5714, 0.6953, 0.724, 0.7795, 0.8081, 0.8636, 0.9012, 0.9388, 0.9764]}]}, {"id": "k3-s05", "ch": 3, "title": "چهار خطای رایج قبل از یخ‌شکن", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s05-01", "text": "قبل از اینکه فرمول‌های یخ‌شکن رو یاد بگیریم، باید چهار تا خطای رایج رو بشناسیم که خیلی از نتورکرها انجامش می‌دن.", "t": [0.0, 0.0349, 0.0615, 0.1131, 0.1896, 0.2412, 0.2678, 0.3027, 0.3754, 0.4199, 0.4644, 0.4918, 0.5363, 0.5808, 0.6082, 0.6784, 0.7057, 0.7502, 0.7776, 0.8563, 0.918, 0.9625]}, {"id": "k3-s05-02", "text": "آگاه بودن از این خطاها، خودش نصف موفقیته.", "t": [0.0578, 0.1661, 0.2745, 0.3412, 0.4287, 0.558, 0.6663, 0.7539, 0.9248]}, {"id": "k3-s05-03", "text": "خطای اول: فقط دنبال آدم خاص نباش. قرار نیست از همون اول لیدر پیدا کنی.", "t": [0.0346, 0.1072, 0.248, 0.3008, 0.3788, 0.4316, 0.4845, 0.5993, 0.6493, 0.6993, 0.73, 0.78, 0.8204, 0.8704, 0.9203, 0.9607]}, {"id": "k3-s05-04", "text": "لیدر بعد از ورود مشخص می‌شه. پس با همه گفت‌وگو کن.", "t": [0.0434, 0.1329, 0.2052, 0.2603, 0.3498, 0.4393, 0.6208, 0.669, 0.7171, 0.7803, 0.8886, 0.9367]}, {"id": "k3-s05-05", "text": "خطای دوم: کلمه‌های اشتباه، آدم درست رو هم خراب می‌کنن.", "t": [0.0391, 0.1387, 0.3115, 0.4483, 0.5915, 0.6463, 0.7142, 0.756, 0.7978, 0.8658, 0.9468]}, {"id": "k3-s05-06", "text": "آدم‌های آینده‌دار، وارد تیم کسی می‌شن که درست حرف بزنه، نه کسی که زیاد حرف بزنه.", "t": [0.0334, 0.1189, 0.2283, 0.29, 0.34, 0.3899, 0.4517, 0.4897, 0.5515, 0.6014, 0.6851, 0.7203, 0.7665, 0.8017, 0.8588, 0.905, 0.9621]}, {"id": "k3-s05-07", "text": "خطای سوم: زیاد حرف زدن با روش غلط فایده‌ای نداره.", "t": [0.0348, 0.1493, 0.3315, 0.413, 0.4788, 0.5446, 0.5947, 0.6605, 0.7262, 0.8547, 0.9518]}, {"id": "k3-s05-08", "text": "اگه اشتباه حرف بزنی، فرقی نمی‌کنه با ده نفر حرف بزنی یا با هزار نفر.", "t": [0.031, 0.0868, 0.1826, 0.2384, 0.3075, 0.3767, 0.4724, 0.5149, 0.5575, 0.6133, 0.6692, 0.7383, 0.7808, 0.8234, 0.8925, 0.9484]}, {"id": "k3-s05-09", "text": "اینکه «هر نه، تو رو به بله نزدیک‌تر می‌کنه» درسته؛ ولی فقط وقتی که درست حرف بزنی.", "t": [0.0307, 0.0616, 0.0776, 0.1078, 0.1613, 0.2148, 0.2683, 0.3385, 0.4757, 0.6076, 0.6335, 0.6776, 0.7217, 0.7763, 0.8099, 0.8645, 0.9086, 0.9632]}, {"id": "k3-s05-10", "text": "خطای چهارم: فرصت رو به کسی بده که خودش ازت بخواد.", "t": [0.0426, 0.1469, 0.3725, 0.4502, 0.498, 0.5459, 0.6086, 0.6714, 0.7192, 0.7969, 0.8596, 0.9523]}, {"id": "k3-s05-11", "text": "اشتباه نکن که فشار بیاری تا معرفی کنی. یخ‌شکن کاری می‌کنه که اون ازت بخواد توضیح بدی.", "t": [0.0237, 0.0998, 0.1442, 0.1781, 0.2331, 0.2987, 0.3325, 0.3981, 0.5015, 0.566, 0.6201, 0.6846, 0.7178, 0.7615, 0.8052, 0.8697, 0.9342, 0.9778]}]}, {"id": "k3-s06", "ch": 3, "title": "قانون طلایی یخ‌شکن", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s06-01", "text": "هر یخ‌شکن موفقی باید سه تا ویژگی اساسی داشته باشه.", "t": [0.0, 0.0594, 0.1745, 0.2896, 0.3862, 0.4456, 0.505, 0.6201, 0.7352, 0.8504, 0.9469]}, {"id": "k3-s06-02", "text": "همین سه تا ویژگی، فرق یه مکالمه‌ی جذاب رو با یه مکالمه‌ی فروشنده‌محور می‌سازن. بدون این سه تا، حتی بهترین جمله‌ها هم نتیجه‌ای که می‌خوای رو نمی‌دن.", "t": [0.02, 0.0571, 0.0799, 0.1027, 0.1469, 0.1769, 0.1997, 0.2582, 0.2952, 0.318, 0.3409, 0.3637, 0.4221, 0.5091, 0.6036, 0.6334, 0.6574, 0.6758, 0.6941, 0.7182, 0.7594, 0.8007, 0.819, 0.866, 0.8843, 0.9256, 0.9439, 0.9794]}, {"id": "k3-s06-03", "text": "اول: خبر بده، نه فروش.", "t": [0.0823, 0.3236, 0.4664, 0.6671, 0.768, 0.9319]}, {"id": "k3-s06-04", "text": "یخ‌شکن یه اطلاع‌رسانی ساده‌ست، نه یه پیشنهاد فروش. لحنش باید مثل خبر دادن یه کشف باشه.", "t": [0.0276, 0.0983, 0.1348, 0.2625, 0.3587, 0.3896, 0.4204, 0.4994, 0.6024, 0.6555, 0.7085, 0.7514, 0.7943, 0.8473, 0.88, 0.9229, 0.9759]}, {"id": "k3-s06-05", "text": "دوم: منفعت بگو، نه ویژگی.", "t": [0.0602, 0.3095, 0.5095, 0.7152, 0.7918, 0.9402]}, {"id": "k3-s06-06", "text": "به‌جای توضیح مشخصات محصول یا کسب‌وکار، از منفعتی حرف بزن که مخاطب به دست میاره.", "t": [0.0286, 0.1029, 0.1771, 0.2633, 0.3375, 0.3758, 0.474, 0.5123, 0.5985, 0.6488, 0.6991, 0.7374, 0.8116, 0.85, 0.9002, 0.9745]}, {"id": "k3-s06-07", "text": "سوم: اختیار بده، نه فشار.", "t": [0.0617, 0.3508, 0.541, 0.7094, 0.7983, 0.9428]}, {"id": "k3-s06-08", "text": "مخاطب باید حس کنه انتخاب دست خودشه. هیچ اجبار یا فشاری نباید توی یخ‌شکن حس بشه.", "t": [0.0289, 0.0993, 0.1583, 0.1947, 0.2424, 0.3241, 0.3718, 0.5007, 0.5464, 0.6139, 0.6487, 0.7162, 0.7836, 0.8293, 0.8968, 0.9316, 0.9773]}]}, {"id": "k3-s07", "ch": 3, "title": "فرمول اول: «راهی پیدا کردم...»", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s07-01", "text": "این فرمول، اصلی‌ترین و قوی‌ترین فرمول یخ‌شکنه، که تام شرایتر معرفیش کرده؛ یکی از برجسته‌ترین متخصص‌های نتورک مارکتینگ.", "t": [0.0, 0.0339, 0.0982, 0.1752, 0.1936, 0.2622, 0.314, 0.3956, 0.4174, 0.446, 0.4951, 0.5443, 0.6245, 0.6583, 0.684, 0.7741, 0.8482, 0.898, 0.9721]}, {"id": "k3-s07-02", "text": "ساختارش طوری طراحی شده که خودبه‌خود کنجکاوی مخاطب رو برمی‌انگیزه.", "t": [0.0392, 0.1533, 0.2256, 0.3119, 0.3703, 0.4148, 0.5428, 0.6569, 0.7431, 0.7876, 0.9435]}, {"id": "k3-s07-03", "text": "ساختار فرمول اینه: «من یه راهی پیدا کردم که...» به‌علاوه‌ی منفعت، به‌علاوه‌ی «اگه دوست داری بدونی چطور...»", "t": [0.0267, 0.0787, 0.1234, 0.2114, 0.2378, 0.2643, 0.3074, 0.3504, 0.3934, 0.4492, 0.5505, 0.6491, 0.7312, 0.7686, 0.815, 0.8614, 0.9167, 0.9631]}, {"id": "k3-s07-04", "text": "خب، چرا این جمله معجزه می‌کنه؟ چهار تا دلیل داره.", "t": [0.0623, 0.1788, 0.2467, 0.3146, 0.3987, 0.4989, 0.6904, 0.7589, 0.8011, 0.8696, 0.9381]}, {"id": "k3-s07-05", "text": "یک: «راهی پیدا کردم» یعنی کشف، و کشف حس ماجراجویی رو برمی‌انگیزه.", "t": [0.0274, 0.0713, 0.1556, 0.24, 0.3639, 0.4352, 0.5303, 0.558, 0.6109, 0.6513, 0.7798, 0.8201, 0.9612]}, {"id": "k3-s07-06", "text": "دو: کشف یعنی کنجکاوی؛ مخاطب می‌خواد بدونه.", "t": [0.0424, 0.1969, 0.2881, 0.401, 0.6472, 0.7418, 0.8516, 0.9462]}, {"id": "k3-s07-07", "text": "سه: کنجکاوی یعنی سؤال؛ خودش می‌پرسه.", "t": [0.0378, 0.2117, 0.3874, 0.4988, 0.6599, 0.7772, 0.9395]}, {"id": "k3-s07-08", "text": "چهار: سؤال یعنی اجازه برای توضیح، و هشدار فروشنده خاموش می‌مونه.", "t": [0.0263, 0.1525, 0.2253, 0.2981, 0.3849, 0.4577, 0.5921, 0.6189, 0.6946, 0.7946, 0.8703, 0.9581]}, {"id": "k3-s07-09", "text": "تو نمی‌گی «بیا بخر»؛ تو می‌گی «یه چیز جالب پیدا کردم.»", "t": [0.0388, 0.0892, 0.1868, 0.2529, 0.3881, 0.447, 0.5428, 0.6018, 0.6792, 0.775, 0.8708, 0.9666]}]}, {"id": "k3-s08", "ch": 3, "title": "مثال‌های فرمول اول در حوزه‌ی لاغری و پوست", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s08-01", "text": "حالا چند تا نمونه‌ی عملی از فرمول «راهی پیدا کردم» رو توی دو تا حوزه‌ی پرکاربرد ببین.", "t": [0.0, 0.0584, 0.1055, 0.1414, 0.2223, 0.2806, 0.3166, 0.3861, 0.4445, 0.5029, 0.5613, 0.5972, 0.6443, 0.6802, 0.7162, 0.7858, 0.889, 0.9474]}, {"id": "k3-s08-02", "text": "این مثال‌ها رو دقیق نگاه کن، و الگوی ساختاریشون رو توی حوزه‌ی کاری خودت پیاده کن.", "t": [0.0305, 0.0748, 0.1507, 0.1845, 0.2393, 0.2941, 0.3503, 0.3752, 0.4453, 0.5719, 0.6081, 0.6556, 0.7257, 0.7845, 0.8433, 0.9134, 0.9496]}, {"id": "k3-s08-03", "text": "توی حوزه‌ی پوست: من یه راهی پیدا کردم که بدون عمل جراحی، چین و چروک کمتر بشه... اگه دوست داری بدونی چطور نتیجه می‌ده.", "t": [0.0226, 0.0533, 0.0985, 0.1739, 0.2007, 0.2276, 0.2712, 0.3148, 0.3584, 0.3852, 0.4288, 0.464, 0.516, 0.5512, 0.5697, 0.6133, 0.6569, 0.7308, 0.7573, 0.79, 0.8228, 0.8618, 0.8946, 0.9336, 0.9664]}, {"id": "k3-s08-04", "text": "من یه راهی پیدا کردم که لک‌های صورت کم می‌شه، بدون اینکه پوست آسیب ببینه... اگه دوست داری بدونی چطور...", "t": [0.0228, 0.0526, 0.0825, 0.1309, 0.1794, 0.2279, 0.2577, 0.3155, 0.3639, 0.3938, 0.4724, 0.5162, 0.5683, 0.6121, 0.6558, 0.7526, 0.7861, 0.8276, 0.8691, 0.9185, 0.96]}, {"id": "k3-s08-05", "text": "من یه راهی پیدا کردم که پوست شفاف‌تر می‌شه، بدون آرایش سنگین... اگه دوست داری بدونی چطور...", "t": [0.0227, 0.0557, 0.0886, 0.1421, 0.1957, 0.2492, 0.2822, 0.3357, 0.4098, 0.4863, 0.5454, 0.6159, 0.7395, 0.7739, 0.8166, 0.8592, 0.9101, 0.9527]}, {"id": "k3-s08-06", "text": "و توی حوزه‌ی لاغری: من یه راهی پیدا کردم که بدون حذف غذای محبوبت، وزن کم کنی... اگه دوست داری بدونی چطور، می‌تونم بگم.", "t": [0.0182, 0.0342, 0.0646, 0.1096, 0.1977, 0.2242, 0.2507, 0.2937, 0.3367, 0.3798, 0.4062, 0.4493, 0.484, 0.5271, 0.5867, 0.6214, 0.6479, 0.7217, 0.7481, 0.7809, 0.8137, 0.8528, 0.8996, 0.9434, 0.969]}, {"id": "k3-s08-07", "text": "من یه راهی پیدا کردم که وقتی رژیم می‌گیری، ضعف نمی‌کنی... اگه دوست داری بدونی چطور، می‌گم.", "t": [0.023, 0.0579, 0.0927, 0.1493, 0.2059, 0.2625, 0.2973, 0.3539, 0.4105, 0.4888, 0.5345, 0.6649, 0.7003, 0.7442, 0.7881, 0.8405, 0.9106, 0.9584]}, {"id": "k3-s08-08", "text": "من یه راهی پیدا کردم که شکم میاد پایین، بدون باشگاه رفتن... اگه دوست داری بدونی چطور...", "t": [0.0227, 0.0514, 0.0801, 0.1268, 0.1735, 0.2202, 0.2489, 0.2866, 0.3333, 0.4038, 0.4845, 0.5962, 0.7388, 0.7771, 0.8246, 0.8722, 0.9288, 0.9763]}]}, {"id": "k3-s09", "ch": 3, "title": "مثال‌های فرمول اول در حوزه‌ی عطر و درآمد", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s09-01", "text": "دو تا حوزه‌ی پرکاربرد دیگه توی نتورک مارکتینگ، عطر و محصولات سبک زندگی، و همین‌طور درآمد و استقلال مالی‌ان.", "t": [0.0, 0.027, 0.0541, 0.1064, 0.1841, 0.228, 0.2635, 0.3159, 0.4284, 0.4654, 0.4848, 0.5571, 0.5942, 0.6787, 0.6968, 0.7646, 0.8158, 0.834, 0.9018, 0.9612]}, {"id": "k3-s09-02", "text": "این مثال‌ها نشون می‌دن چطوری می‌شه فرمول «راهی پیدا کردم» رو توی این حوزه‌ها به کار برد.", "t": [0.0329, 0.0778, 0.1549, 0.2106, 0.2663, 0.3326, 0.3883, 0.4547, 0.5104, 0.566, 0.6217, 0.656, 0.7009, 0.7459, 0.823, 0.8573, 0.9022, 0.9472]}, {"id": "k3-s09-03", "text": "توی حوزه‌ی عطر: من یه راهی پیدا کردم که یه رایحه‌ی خاص داشته باشی، بدون اینکه هزینه‌ی عجیبی بدی... اگه دوست داری بدونی چطور...", "t": [0.0189, 0.0489, 0.0932, 0.1636, 0.1871, 0.2107, 0.2489, 0.2872, 0.3255, 0.349, 0.3726, 0.4255, 0.4565, 0.5021, 0.5403, 0.5786, 0.6242, 0.6772, 0.7228, 0.802, 0.8294, 0.8634, 0.8974, 0.9378, 0.9718]}, {"id": "k3-s09-04", "text": "من یه راهی پیدا کردم که عطر تا آخر روز بمونه... اگه دوست داری بدونی چطور...", "t": [0.0189, 0.0589, 0.0988, 0.1637, 0.2286, 0.2934, 0.3334, 0.3858, 0.4257, 0.4781, 0.5305, 0.6789, 0.7233, 0.7782, 0.8331, 0.8986, 0.9536]}, {"id": "k3-s09-05", "text": "من یه راهی پیدا کردم که هر فصل یه رایحه‌ی مخصوص خودت داشته باشی... اگه دوست داری بدونی چطور...", "t": [0.0163, 0.0486, 0.0809, 0.1333, 0.1858, 0.2383, 0.2705, 0.3028, 0.3452, 0.3775, 0.4501, 0.5127, 0.5651, 0.6277, 0.7424, 0.7775, 0.821, 0.8644, 0.9162, 0.9597]}, {"id": "k3-s09-06", "text": "و توی حوزه‌ی درآمد و سبک زندگی: من یه راهی پیدا کردم که بدون اینکه شغلمو از دست بدم، هر ماه یه حقوق اضافه داشته باشم...", "t": [0.0144, 0.0311, 0.063, 0.11, 0.1571, 0.1738, 0.2056, 0.3008, 0.3246, 0.3484, 0.3871, 0.4257, 0.4644, 0.4882, 0.5269, 0.573, 0.6192, 0.643, 0.6742, 0.717, 0.7411, 0.7728, 0.7969, 0.8361, 0.8829, 0.9296, 0.9688]}, {"id": "k3-s09-07", "text": "من یه راهی پیدا کردم که با گوشی موبایل، توی خونه درآمد داشته باشم...", "t": [0.0269, 0.0688, 0.1107, 0.1789, 0.247, 0.3152, 0.3571, 0.3991, 0.4672, 0.6038, 0.6565, 0.7217, 0.7995, 0.8773, 0.9425]}, {"id": "k3-s09-08", "text": "من یه راهی پیدا کردم که توی سفر هم پول دربیارم...", "t": [0.0361, 0.0939, 0.1518, 0.2458, 0.3398, 0.4339, 0.4917, 0.5677, 0.6436, 0.7014, 0.7774, 0.9256]}, {"id": "k3-s09-09", "text": "من یه راهی پیدا کردم که کنار بچه‌هام باشم و درآمد مستقل داشته باشم...", "t": [0.0248, 0.0676, 0.1103, 0.1798, 0.2493, 0.3187, 0.3615, 0.431, 0.5272, 0.5966, 0.626, 0.7088, 0.7917, 0.8745, 0.944]}, {"id": "k3-s09-10", "text": "من یه راهی پیدا کردم که تورم کمتر اذیتم کنه...", "t": [0.0365, 0.0988, 0.1611, 0.2623, 0.3636, 0.4649, 0.5272, 0.6284, 0.7297, 0.8504, 0.9322]}, {"id": "k3-s09-11", "text": "من یه راهی پیدا کردم که وقت آزاد بیشتری داشته باشم، و درآمدم هم رشد کنه...", "t": [0.0207, 0.0619, 0.103, 0.1698, 0.2367, 0.3036, 0.3447, 0.3987, 0.4656, 0.5581, 0.6378, 0.7047, 0.733, 0.8256, 0.8667, 0.9207, 0.9747]}]}, {"id": "k3-s10", "ch": 3, "title": "نکته‌ی کلیدی بعد از یخ‌شکن", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s10-01", "text": "گفتن یخ‌شکن، فقط نصف مهارته. کاری که بعد از گفتنش می‌کنی، همون‌قدر مهمه.", "t": [0.0, 0.0825, 0.1808, 0.2474, 0.3141, 0.495, 0.5465, 0.5782, 0.6197, 0.6514, 0.7127, 0.7897, 0.8928, 0.9582]}, {"id": "k3-s10-02", "text": "خیلی از نتورکرها یخ‌شکن رو درست می‌گن، ولی با رفتار بعدیشون اثرش رو از بین می‌برن.", "t": [0.0397, 0.0968, 0.132, 0.2332, 0.3013, 0.3365, 0.3937, 0.4823, 0.5283, 0.5633, 0.6312, 0.721, 0.778, 0.813, 0.8481, 0.8941, 0.962]}, {"id": "k3-s10-03", "text": "سه تا حرکت داری.", "t": [0.1446, 0.2741, 0.4037, 0.6142, 0.8248]}, {"id": "k3-s10-04", "text": "اول، یخ‌شکن رو می‌گی.", "t": [0.1101, 0.4339, 0.6155, 0.7093, 0.8616]}, {"id": "k3-s10-05", "text": "بعد، ساکت می‌شی تا برای واکنش مخاطب فضا باز بشه.", "t": [0.0555, 0.1669, 0.2595, 0.3521, 0.4091, 0.5017, 0.6122, 0.7226, 0.7974, 0.8722, 0.947]}, {"id": "k3-s10-06", "text": "بعد، می‌ذاری خودش بپرسه، و اجازه می‌دی کنجکاویش شکل بگیره. اگه لازم بود، بحث رو عوض می‌کنی و می‌بریش سمت یه مسیر سازنده.", "t": [0.0242, 0.0898, 0.1378, 0.1725, 0.2341, 0.2496, 0.2935, 0.3302, 0.3953, 0.425, 0.5238, 0.5549, 0.5935, 0.6247, 0.6559, 0.6797, 0.7109, 0.7569, 0.7732, 0.8267, 0.8579, 0.8816, 0.9202, 0.9737]}, {"id": "k3-s10-07", "text": "اجرای درست این سه قدم، نشونه‌ی اعتمادبه‌نفس و حرفه‌ای بودن توئه.", "t": [0.0425, 0.1343, 0.2112, 0.2734, 0.3207, 0.3829, 0.4895, 0.67, 0.7026, 0.8092, 0.8861, 0.9631]}, {"id": "k3-s10-08", "text": "سکوت بعد از یخ‌شکن، قوی‌ترین ابزار توئه.", "t": [0.0495, 0.1796, 0.2846, 0.3646, 0.5582, 0.7198, 0.842, 0.9445]}, {"id": "k3-s10-09", "text": "اگه پرسید «چی؟ چطوری؟» یعنی سؤال سوم تیک خورده: جالبه. حالا اجازه داری توضیح بدی.", "t": [0.0283, 0.058, 0.1017, 0.1588, 0.2462, 0.3218, 0.3974, 0.4585, 0.5196, 0.6392, 0.7822, 0.8187, 0.8623, 0.8988, 0.9423, 0.9718]}, {"id": "k3-s10-10", "text": "و اگه نپرسید، تو هیچ‌چیزی از دست ندادی؛ چون فشار نیاوردی و رابطه سالم مونده.", "t": [0.0294, 0.057, 0.1096, 0.2223, 0.2557, 0.3412, 0.3746, 0.4184, 0.5233, 0.5743, 0.6374, 0.737, 0.7637, 0.839, 0.9022, 0.9775]}]}, {"id": "k3-s11", "ch": 3, "title": "فرمول دوم: سؤال انگیزشی", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s11-01", "text": "فرمول دوم یخ‌شکن، رویکرد متفاوتی داره، ولی همون‌قدر قوی‌یه.", "t": [0.0, 0.1149, 0.1928, 0.3514, 0.4463, 0.5544, 0.6554, 0.72, 0.8463, 0.9417]}, {"id": "k3-s11-02", "text": "این فرمول اول یه واقعیت جذاب می‌سازه، بعد خودت رو به‌عنوان صاحب راهکار معرفی می‌کنه، و همچنان اختیار رو دست مخاطب نگه می‌داره.", "t": [0.025, 0.0586, 0.1083, 0.142, 0.1677, 0.2254, 0.2671, 0.3675, 0.3963, 0.432, 0.454, 0.5103, 0.546, 0.5954, 0.638, 0.6806, 0.6957, 0.7451, 0.7946, 0.8165, 0.8454, 0.888, 0.9168, 0.9662]}, {"id": "k3-s11-03", "text": "ساختار فرمول دوم اینه: «خوبه که...» به‌علاوه‌ی منفعت، به‌علاوه‌ی «مگه نه؟ من براش راهکار دارم.»", "t": [0.0262, 0.0927, 0.1499, 0.1887, 0.2849, 0.3396, 0.4332, 0.5246, 0.6171, 0.657, 0.6752, 0.7009, 0.7417, 0.808, 0.8998, 0.966]}, {"id": "k3-s11-04", "text": "چند تا مثال: خوبه که توی سفر هم درآمد داشته باشی، مگه نه؟ من براش راهکار دارم.", "t": [0.0311, 0.0652, 0.0911, 0.2246, 0.2806, 0.3151, 0.3604, 0.4056, 0.4401, 0.5069, 0.5737, 0.6297, 0.6749, 0.7697, 0.7966, 0.8403, 0.9008, 0.9445]}, {"id": "k3-s11-05", "text": "خوبه که یه درآمد دوم داشته باشی، بدون اینکه شغلت رو از دست بدی، مگه نه؟ من براش راهکار دارم.", "t": [0.0348, 0.0836, 0.1137, 0.1437, 0.2019, 0.2413, 0.2995, 0.3483, 0.3971, 0.4553, 0.5041, 0.5342, 0.5642, 0.6036, 0.6647, 0.7034, 0.7887, 0.8142, 0.8556, 0.913, 0.9544]}, {"id": "k3-s11-06", "text": "خوبه که کنار بچه‌هات باشی و پول هم دربیاری، مگه نه؟ من براش راهکار دارم.", "t": [0.037, 0.1009, 0.1403, 0.2042, 0.2927, 0.3567, 0.3837, 0.4353, 0.4747, 0.597, 0.6465, 0.7494, 0.7794, 0.8281, 0.8955, 0.9442]}, {"id": "k3-s11-07", "text": "خوبه که رژیم بگیری ولی ضعف نداشته باشی، مگه نه؟ من براش راهکار دارم.", "t": [0.0434, 0.1088, 0.1491, 0.2145, 0.2926, 0.3454, 0.3983, 0.4889, 0.5762, 0.6284, 0.7363, 0.7677, 0.8185, 0.889, 0.9399]}, {"id": "k3-s11-08", "text": "خوبه که پوستت شفاف‌تر بشه، بدون هزینه‌های عجیب، مگه نه؟ من براش راهکار دارم.", "t": [0.0384, 0.1037, 0.1439, 0.2217, 0.3121, 0.3648, 0.4301, 0.5457, 0.6258, 0.6259, 0.6626, 0.7107, 0.789, 0.8974, 0.9756]}]}, {"id": "k3-s12", "ch": 3, "title": "وقتی نمی‌دونی مشکل طرف چیه", "eyebrow": "فصل سوم · یخ‌شکن", "lines": [{"id": "k3-s12-01", "text": "گاهی اوقات اول مکالمه نمی‌دونی درد اصلی مخاطب چیه.", "t": [0.0, 0.0939, 0.2058, 0.2816, 0.4116, 0.5597, 0.6355, 0.7294, 0.8413, 0.9171]}, {"id": "k3-s12-02", "text": "دغدغه‌ش پوله؟ پوسته؟ سلامته؟ زمانه؟ خانواده‌ست؟ اون‌وقت چی کار کنی؟", "t": [0.0323, 0.1158, 0.22, 0.3457, 0.5105, 0.6515, 0.7584, 0.8339, 0.8674, 0.9115, 0.9555]}, {"id": "k3-s12-03", "text": "توی همچین شرایطی، نباید همین‌طوری یه یخ‌شکن رو انتخاب کنی.", "t": [0.039, 0.1054, 0.2035, 0.3175, 0.4156, 0.5611, 0.6118, 0.7099, 0.7605, 0.8744, 0.9409]}, {"id": "k3-s12-04", "text": "به‌جاش از تکنیک «سؤال‌های آیا» استفاده کن، تا اول درد واقعی مخاطب رو کشف کنی.", "t": [0.019, 0.0814, 0.1136, 0.176, 0.2585, 0.3201, 0.4301, 0.473, 0.5159, 0.5723, 0.6286, 0.7118, 0.795, 0.8379, 0.8943, 0.9506]}, {"id": "k3-s12-05", "text": "چند تا نمونه از سؤال‌های آیا، برای پیدا کردن مشکل: آیا تا حالا شده حس کنی حقوقت کافی نیست؟", "t": [0.0266, 0.0682, 0.0999, 0.1613, 0.193, 0.2742, 0.3158, 0.3673, 0.4188, 0.4702, 0.5861, 0.6248, 0.6542, 0.7021, 0.7408, 0.7702, 0.8089, 0.866, 0.9139, 0.9617]}, {"id": "k3-s12-06", "text": "آیا دوست داری یه درآمد دوم داشته باشی؟ آیا دوست داری وقت آزاد بیشتری داشته باشی؟", "t": [0.0209, 0.0661, 0.1221, 0.1781, 0.2126, 0.2794, 0.3247, 0.3914, 0.5024, 0.5472, 0.6026, 0.6579, 0.7027, 0.7581, 0.8348, 0.9008, 0.9562]}, {"id": "k3-s12-07", "text": "آیا تا حالا شده از پوستت توی آینه ناراحت بشی؟ آیا دوست داری چین و چروکت کمتر بشه؟", "t": [0.0187, 0.0627, 0.0963, 0.1508, 0.1948, 0.2283, 0.2933, 0.3373, 0.3917, 0.4672, 0.5686, 0.6134, 0.6689, 0.7244, 0.7692, 0.7926, 0.8588, 0.9142, 0.959]}, {"id": "k3-s12-08", "text": "آیا دوست داری انرژی روزت بیشتر باشه؟ آیا دوست داری بیشتر سفر بری؟", "t": [0.022, 0.0772, 0.1456, 0.214, 0.2955, 0.3639, 0.4454, 0.5784, 0.6326, 0.6997, 0.7668, 0.8468, 0.901, 0.9552]}, {"id": "k3-s12-09", "text": "آیا دوست داری یه کاری داشته باشی که به مکان وابسته نباشه؟", "t": [0.0, 0.066, 0.1478, 0.2295, 0.2798, 0.3616, 0.4591, 0.5408, 0.5911, 0.6414, 0.7232, 0.8364, 0.9339]}, {"id": "k3-s12-10", "text": "اگه گفت «نه»، یخ‌شکن اون موضوع رو نمی‌گی. این یعنی داری غربال می‌کنی، نه اینکه به همه فشار بیاری.", "t": [0.0165, 0.07, 0.1235, 0.1969, 0.2542, 0.293, 0.3503, 0.3798, 0.4836, 0.5201, 0.5654, 0.6106, 0.6646, 0.7336, 0.7596, 0.81, 0.836, 0.8702, 0.9125, 0.9629]}, {"id": "k3-s12-11", "text": "اگه گفت «آره»، یخ‌شکن همون درد رو می‌گی، و مستقیم به نقطه
